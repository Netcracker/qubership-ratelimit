version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - ginkgolinter
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    # The service is the data plane and holds no Kubernetes client: its pod
    # carries no Role and no token, so a package under service/ that imported
    # one would be a design breach the compiler cannot see. The rule covers
    # what the files under service/ import; the build-information check in CI
    # covers what they import transitively.
    depguard:
      rules:
        service:
          files:
            - "**/service/**"
          deny:
            - pkg: k8s.io/client-go
              desc: the service holds no Kubernetes client (ADR 0007)
            - pkg: sigs.k8s.io/controller-runtime
              desc: the service holds no Kubernetes client (ADR 0007)
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
        - name: var-naming
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: (api|cmd)
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
