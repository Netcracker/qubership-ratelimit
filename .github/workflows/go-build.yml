# Go Build Workflow
#
# Builds and tests the service, then builds its Docker image.
# Uses generic-go-build.yaml for the actual build process.
#
# Triggers:
#   - Push to main or an lts/** branch
#   - Pull requests
#
# See generic-go-build.yaml for full documentation on build features and required secrets/vars.

name: Build

run-name: >
  Build —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

# The default token is read-only; jobs that need more say so themselves.
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and test
    # Waits for the engine job so its coverage artifact exists before the
    # Sonar job downloads coverage-* artifacts.
    needs: engine
    # Exactly what generic-go-build.yaml declares for itself: a called workflow
    # can only narrow the caller's token, never widen it.
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      # Pinned to the root on purpose: module discovery would also run the
      # workflow's envtest step for engine/, and that step hard-fails on a
      # module without controller-runtime. The engine job below tests the
      # engine module instead and ships its coverage as a coverage-* artifact,
      # which the Sonar job picks up by glob.
      go-module-dir: .
      # internal/controller runs against a real API server through envtest.
      # Without this the suite fails on a missing control plane rather than skipping.
      install-envtest: true
      # Matches k8s.io/api in go.mod, so the test control plane cannot drift from
      # the client libraries the service is built against.
      kube-version: '1.36.0'
      # Pull requests build a single native platform: the image is validation
      # only there, and the two cross-compilations otherwise contend for the
      # runner's cores. Pushes keep the full multi-arch config.
      docker-config-file: ${{ github.event_name == 'pull_request' && 'docker-dev-config-pr.json' || 'docker-dev-config.json' }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets:
      # generic-go-build.yaml declares exactly one secret, and it is required.
      # Inheriting the whole set would hand a reusable workflow every credential
      # this repository holds.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The engine is a separate Go module the root job's ./... does not see.
  # This job tests it with the race detector and ships its coverage as a
  # coverage-* artifact — the naming convention the generic workflow's Sonar
  # job downloads by glob. No setup-go: GOTOOLCHAIN=auto fetches the version
  # engine/go.mod declares.
  golangci:
    name: golangci-lint (both modules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make lint builds golangci-lint from source with `go install`, and a
      # binary built by an older Go refuses to target this module's version -
      # so the job needs exactly the toolchain go.mod declares, not whatever
      # the runner has preinstalled.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Whole-module runs with the Makefile's pinned golangci-lint. This is
      # the linting GO_MODULES would do, minus its per-directory mode, which
      # cannot cope with a module whose root holds no .go files.
      - name: Lint the root and engine modules
        run: make lint

  load:
    name: Load floor
    runs-on: ubuntu-latest
    # go test executes code from the PR; the job gets a read-only token and
    # checkout keeps no credentials on disk for that code to find.
    permissions:
      contents: read
    # The floor is a claim about a replica backed by a shared store, so the
    # measurement runs against a real one. A service container answers on
    # loopback, which is the closest this runner gets to the same-zone store
    # the latency budget assumes.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No -race: the detector costs about an order of magnitude, which would
      # measure the detector rather than the decision path. The same tests run
      # under -race in the other jobs; this one owns the number.
      - name: Measure the decision throughput a replica owes
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./internal/rls/ -run TestLoad -v -count=1

  engine:
    name: Engine module tests (race)
    runs-on: ubuntu-latest
    # go test executes code from the PR; the job gets a read-only token and
    # checkout keeps no credentials on disk for that code to find.
    permissions:
      contents: read
    # The Redis store tests gate on REDIS_ADDR and skip without it; the
    # service container makes them run — conformance, differential, oracle —
    # on every PR.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test engine module
        working-directory: engine
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: |
          go vet ./...
          go test -race ./... -coverpkg=./... -coverprofile engine.coverage.out

      # The standalone service above cannot refuse a cross-slot script, so it
      # never exercises the slot mechanics the key contract exists for: the
      # {domain} hash tag that lets one Lua script decide a whole domain
      # atomically. A real six-node cluster closes that - a lost hash tag
      # fails here with CROSSSLOT instead of in production.
      # The cluster run has code of its own, the per-master walk of Scan and
      # the cursor that names a master, so its coverage ships to Sonar beside
      # the standalone run's: the Sonar job collects every *.coverage.out of
      # the coverage-* artifacts and merges them.
      - name: Test the store against a Redis Cluster
        working-directory: engine
        run: |
          REDIS_ADDR="$(../hack/redis-cluster.sh up)" \
            go test -race ./store/redis/ -count=1 -coverpkg=./... -coverprofile engine.cluster.coverage.out

      # The command store keeps its records, sweep lease, and confirmation
      # tokens beside the counters they act on, and its scripts touch both in
      # one call. Only a real cluster refuses a script whose keys hash to two
      # slots, so only this step can catch a record key that drifted out of the
      # domain's tag - or a script declaring a key it does not use, which an
      # empty string turns into slot 0.
      - name: Test the command store against a Redis Cluster
        run: |
          REDIS_ADDR="$(hack/redis-cluster.sh up)" \
            go test -race ./internal/records/ -count=1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-engine
          path: |
            engine/engine.coverage.out
            engine/engine.cluster.coverage.out
          if-no-files-found: error

  # The chart's CRD templates are generated artifacts — copies of
  # config/crd/bases with the keep annotation injected — and nothing but this
  # gate stops an api/ change from shipping a chart whose CRDs no longer match
  # the operator. helm lint runs once per resource profile, because the chart
  # is never installed without one.
  helm:
    name: Helm lint and CRD drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the chart against every resource profile
        run: make helm-lint

      # The management port is safe only behind its AuthorizationPolicy, and the
      # policy is only worth anything if it names the identity the gateway
      # actually runs as. Istio's automated deployment appends the gateway class
      # to the name, so a principal built from the gateway name alone denies the
      # gateway itself - and nothing in a lint or a unit test can see that.
      - name: Check what the management AuthorizationPolicy allows
        run: |
          rendered=$(helm template t helm-templates/ratelimit \
            -f helm-templates/ratelimit/resource-profiles/dev.yaml \
            --set management.enabled=true \
            --show-only templates/AuthorizationPolicy.yaml)
          echo "$rendered"
          echo "$rendered" | grep -q 'sa/private-gateway-istio' || {
            echo "::error::the policy does not allow the private gateway's service account"
            exit 1
          }

      # The port and the policy ship together: a release that opens the port
      # without the policy leaves endpoints that lift rate limits reachable by
      # every workload in the mesh.
      - name: Check that the management port is never rendered alone
        run: |
          set -o pipefail
          manifests=$(helm template t helm-templates/ratelimit \
            -f helm-templates/ratelimit/resource-profiles/dev.yaml \
            --set management.enabled=true)
          echo "$manifests" | grep -q 'management-bind-address' || {
            echo "::error::management.enabled did not render the port"; exit 1; }
          echo "$manifests" | grep -q 'kind: AuthorizationPolicy' || {
            echo "::error::the management port rendered without its AuthorizationPolicy"; exit 1; }

      # In-process counting keeps the idempotency records and confirmation
      # tokens in one replica's memory, so a preview and its confirmation can
      # land on different pods.
      - name: Check that management refuses the in-process store above one replica
        run: |
          if helm template t helm-templates/ratelimit \
            -f helm-templates/ratelimit/resource-profiles/prod.yaml \
            --set management.enabled=true >/dev/null 2>&1; then
            echo "::error::two replicas without redis.addresses rendered a management API"
            exit 1
          fi
      - name: Regenerate the manifests and the chart CRDs
        run: make sync-helm-crds
      - name: Fail on drift between the generated files and the commit
        run: |
          if ! git diff --exit-code -- config/rbac config/crd/bases helm-templates/ratelimit/templates; then
            echo "::error::generated manifests drifted from the commit: run 'make sync-helm-crds' and commit the result"
            exit 1
          fi
