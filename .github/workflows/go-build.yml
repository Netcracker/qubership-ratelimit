# Go Build Workflow
#
# Builds and tests the service, then builds its Docker image.
# Uses generic-go-build.yaml for the actual build process.
#
# Triggers:
#   - Push to main or an lts/** branch
#   - Pull requests
#
# See generic-go-build.yaml for full documentation on build features and required secrets/vars.

name: Build

run-name: >
  Build —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

# The default token is read-only; jobs that need more say so themselves.
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and test
    # Waits for the engine job so its coverage artifact exists before the
    # Sonar job downloads coverage-* artifacts.
    needs: engine
    # Exactly what generic-go-build.yaml declares for itself: a called workflow
    # can only narrow the caller's token, never widen it.
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      # Pinned to the root on purpose: module discovery would also run the
      # workflow's envtest step for engine/, and that step hard-fails on a
      # module without controller-runtime. The engine job below tests the
      # engine module instead and ships its coverage as a coverage-* artifact,
      # which the Sonar job picks up by glob.
      go-module-dir: .
      # internal/controller runs against a real API server through envtest.
      # Without this the suite fails on a missing control plane rather than skipping.
      install-envtest: true
      # Matches k8s.io/api in go.mod, so the test control plane cannot drift from
      # the client libraries the service is built against.
      kube-version: '1.36.0'
      # Pull requests build a single native platform: the image is validation
      # only there, and the two cross-compilations otherwise contend for the
      # runner's cores. Pushes keep the full multi-arch config.
      docker-config-file: ${{ github.event_name == 'pull_request' && 'docker-dev-config-pr.json' || 'docker-dev-config.json' }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets:
      # generic-go-build.yaml declares exactly one secret, and it is required.
      # Inheriting the whole set would hand a reusable workflow every credential
      # this repository holds.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The engine is a separate Go module the root job's ./... does not see.
  # This job tests it with the race detector and ships its coverage as a
  # coverage-* artifact — the naming convention the generic workflow's Sonar
  # job downloads by glob. It also runs the root module's unit tests under
  # the race detector, which the generic workflow does not: its test step
  # runs without -race. No setup-go: GOTOOLCHAIN=auto fetches the version
  # each module's go.mod declares.
  golangci:
    name: golangci-lint (both modules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make lint builds golangci-lint from source with `go install`, and a
      # binary built by an older Go refuses to target this module's version -
      # so the job needs exactly the toolchain go.mod declares, not whatever
      # the runner has preinstalled.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Whole-module runs with the Makefile's pinned golangci-lint. This is
      # the linting GO_MODULES would do, minus its per-directory mode, which
      # cannot cope with a module whose root holds no .go files.
      - name: Lint the root and engine modules
        run: make lint

  load:
    name: Load floor
    runs-on: ubuntu-latest
    # go test executes code from the PR; the job gets a read-only token and
    # checkout keeps no credentials on disk for that code to find.
    permissions:
      contents: read
    # The floor is a claim about a replica backed by a shared store, so the
    # measurement runs against a real one. A service container answers on
    # loopback, which is the closest this runner gets to the same-zone store
    # the latency budget assumes.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No -race: the detector costs about an order of magnitude, which would
      # measure the detector rather than the decision path. The same tests run
      # under -race in the other jobs; this one owns the number.
      - name: Measure the decision throughput a replica owes
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./internal/rls/ -run TestLoad -v -count=1

  service-binary:
    name: Service binary carries no Kubernetes client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The depguard rule keeps client-go and controller-runtime out of the
      # files under service/; what it cannot see is a root package the
      # service imports pulling one in. The build information of the linked
      # binary lists every module that contributed a package, so this is the
      # check that holds whatever the import graph does.
      - name: Build the service and read its build information
        run: |
          go build -o bin/ratelimit-service ./service/cmd/
          go version -m bin/ratelimit-service | grep -E '^\s+dep\s+' | tee service-deps.txt
          if grep -E '^\s+dep\s+(k8s.io/client-go|sigs.k8s.io/controller-runtime)\s' service-deps.txt; then
            echo "::error::the service binary depends on a Kubernetes client; see service-deps.txt above"
            exit 1
          fi

  engine:
    name: Engine module tests (race)
    runs-on: ubuntu-latest
    # go test executes code from the PR; the job gets a read-only token and
    # checkout keeps no credentials on disk for that code to find.
    permissions:
      contents: read
    # The Redis store tests gate on REDIS_ADDR and skip without it; the
    # service container makes them run — conformance, differential, oracle —
    # on every PR.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test engine module
        working-directory: engine
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: |
          go vet ./...
          go test -race ./... -coverpkg=./... -coverprofile engine.coverage.out

      # The generic workflow runs the root module's tests without -race; this
      # step runs them with the detector on, with the Redis service for
      # internal/records. The target takes the package list of make test-unit,
      # so the controller suite is left out the way test-unit leaves it out:
      # it needs the envtest control plane the generic workflow installs for
      # its own run.
      - name: Test the root module under the race detector
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: make test-unit-race

      # The standalone service above cannot refuse a cross-slot script, so it
      # never exercises the slot mechanics the key contract exists for: the
      # {domain} hash tag that lets one Lua script decide a whole domain
      # atomically. A real six-node cluster closes that - a lost hash tag
      # fails here with CROSSSLOT instead of in production.
      # The cluster run has code of its own, the per-master walk of Scan and
      # the cursor that names a master, so its coverage ships to Sonar beside
      # the standalone run's: the Sonar job collects every *.coverage.out of
      # the coverage-* artifacts and merges them.
      - name: Test the store against a Redis Cluster
        working-directory: engine
        run: |
          REDIS_ADDR="$(../hack/redis-cluster.sh up)" \
            go test -race ./store/redis/ -count=1 -coverpkg=./... -coverprofile engine.cluster.coverage.out

      # The command store keeps its records, sweep lease, and confirmation
      # tokens beside the counters they act on, and its scripts touch both in
      # one call. Only a real cluster refuses a script whose keys hash to two
      # slots, so only this step can catch a record key that drifted out of the
      # domain's tag - or a script declaring a key it does not use, which an
      # empty string turns into slot 0.
      - name: Test the command store against a Redis Cluster
        run: |
          REDIS_ADDR="$(hack/redis-cluster.sh up)" \
            go test -race ./internal/records/ -count=1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-engine
          path: |
            engine/engine.coverage.out
            engine/engine.cluster.coverage.out
          if-no-files-found: error

  # The chart's CRD templates are generated artifacts — copies of
  # config/crd/bases with the keep annotation injected — and nothing but this
  # gate stops an api/ change from shipping a chart whose CRDs no longer match
  # the operator. helm lint runs once per resource profile, because the chart
  # is never installed without one.
  helm:
    name: Helm lint and CRD drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint every chart against every resource profile, in every mode
        run: make helm-lint

      # The render test in Go: both charts of the split rendered and compared
      # with the constants of api/contract, the Service name and its ports,
      # the address in the filters, the ConfigMap of the volume, the mount
      # path, the pod labels; a satellite rendering the filters alone from the
      # operator chart and nothing from the service chart. It skips without
      # helm on PATH; here helm is on PATH and the skip is a failure.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compare the rendered charts with the contract constants
        env:
          CHARTS_TEST_REQUIRE_HELM: "1"
        run: go test -count=1 ./tests/charts/

      # A satellite namespace runs no component. What it gets is the gateway
      # filters, and they have to point at the baseline's Service by its fixed
      # name - a satellite has no other way to know how the baseline was
      # installed. Both halves are checked for the operator chart: nothing but
      # filters, and the address they carry. The service chart renders nothing
      # there at all.
      - name: Check what a satellite renders
        run: |
          set -o pipefail
          for chart in ratelimit-operator; do
            rendered=$(helm template t helm-templates/$chart -n satellite \
              -f helm-templates/$chart/resource-profiles/dev.yaml \
              --set MONITORING_ENABLED=true --set management.enabled=true \
              --set BASELINE_ORIGIN=baseline)
            kinds=$(echo "$rendered" | grep '^kind:' | sort -u)
            [ "$kinds" = "kind: EnvoyFilter" ] || {
              echo "::error::a satellite of $chart rendered more than its gateway filters:"; echo "$kinds"; exit 1; }
            echo "$rendered" | grep -q 'ratelimit\.baseline\.svc\.cluster\.local' || {
              echo "::error::the satellite filters of $chart do not point at the baseline's ratelimit Service"; exit 1; }
            # A blue-green baseline runs its shared components in the controller
            # namespace, and that is where the filters must point.
            helm template t helm-templates/$chart -n satellite \
              -f helm-templates/$chart/resource-profiles/dev.yaml \
              --set BASELINE_ORIGIN=baseline --set BASELINE_CONTROLLER=baseline-ctl \
              | grep -q 'ratelimit\.baseline-ctl\.svc\.cluster\.local' || {
              echo "::error::the satellite filters of $chart ignore BASELINE_CONTROLLER"; exit 1; }
          done
          rendered=$(helm template t helm-templates/ratelimit-service -n satellite \
            -f helm-templates/ratelimit-service/resource-profiles/dev.yaml \
            --set MONITORING_ENABLED=true --set management.enabled=true \
            --set BASELINE_ORIGIN=baseline)
          if echo "$rendered" | grep -q '^kind:'; then
            echo "::error::a satellite of ratelimit-service rendered objects:"; echo "$rendered" | grep '^kind:'; exit 1
          fi

      # The management port is safe only behind its AuthorizationPolicy, and the
      # policy is only worth anything if it names the identity the gateway
      # actually runs as. Istio's automated deployment appends the gateway class
      # to the name, so a principal built from the gateway name alone denies the
      # gateway itself - and nothing in a lint or a unit test can see that.
      - name: Check what the management AuthorizationPolicy allows
        run: |
          for chart in ratelimit-service; do
            rendered=$(helm template t helm-templates/$chart \
              -f helm-templates/$chart/resource-profiles/dev.yaml \
              --set management.enabled=true \
              --show-only templates/AuthorizationPolicy.yaml)
            echo "$rendered"
            echo "$rendered" | grep -q 'sa/private-gateway-istio' || {
              echo "::error::the policy of $chart does not allow the private gateway's service account"
              exit 1
            }
          done

      # The port and the policy ship together: a release that opens the port
      # without the policy leaves endpoints that lift rate limits reachable by
      # every workload in the mesh.
      - name: Check that the management port is never rendered alone
        run: |
          set -o pipefail
          for chart in ratelimit-service; do
            manifests=$(helm template t helm-templates/$chart \
              -f helm-templates/$chart/resource-profiles/dev.yaml \
              --set management.enabled=true)
            echo "$manifests" | grep -q 'management-bind-address' || {
              echo "::error::management.enabled did not render the port in $chart"; exit 1; }
            echo "$manifests" | grep -q 'kind: AuthorizationPolicy' || {
              echo "::error::the management port of $chart rendered without its AuthorizationPolicy"; exit 1; }
          done

      # The management values in every mode. Single and baseline render the
      # port, the policy, and the identity configuration; a satellite runs no
      # component, so it renders none of them however the values are set. The
      # identity values are checked by their rendered names, which are what
      # the configloader maps onto the properties the service reads.
      - name: Check the management values in every mode
        run: |
          set -o pipefail
          identity=(--set management.enabled=true
            --set management.claims.roles=realm_access.roles
            --set 'management.roles.viewer={rl-view}' --set 'management.roles.operator={rl-admin}')
          for chart in ratelimit-service; do
            render() {
              helm template t helm-templates/$chart \
                -f helm-templates/$chart/resource-profiles/dev.yaml "${identity[@]}" "$@"
            }
            for mode in single baseline; do
              extra=(); [ "$mode" = baseline ] && extra=(--set ORIGIN_NAMESPACE=baseline)
              manifests=$(render "${extra[@]}")
              for want in 'management-bind-address' 'kind: AuthorizationPolicy' \
                'MANAGEMENT_CLAIMS_ROLES' "value: 'realm_access.roles'" "value: 'rl-view'" "value: 'rl-admin'"; do
                echo "$manifests" | grep -qF -- "$want" || {
                  echo "::error::$chart in mode $mode did not render: $want"; exit 1; }
              done
            done
            satellite=$(render -n satellite --set BASELINE_ORIGIN=baseline)
            for forbidden in 'management-bind-address' 'kind: AuthorizationPolicy' 'MANAGEMENT_'; do
              if echo "$satellite" | grep -qF -- "$forbidden"; then
                echo "::error::a satellite of $chart rendered $forbidden"; exit 1
              fi
            done
          done

      # An in-process store above one replica is a limit that admits N per
      # replica, and the management API's records live in that same memory.
      # The chart refuses to render it, with the message the runbook names.
      - name: Check that the in-process store is refused above one replica
        run: |
          for chart in ratelimit-service; do
            set +e
            out=$(helm template t helm-templates/$chart \
              -f helm-templates/$chart/resource-profiles/prod.yaml 2>&1)
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::two replicas without redis.addresses rendered in $chart"; exit 1
            fi
            echo "$out" | grep -q 'in-process store needs exactly one replica; set redis.addresses' || {
              echo "::error::the render of $chart failed for a reason other than validateStore:"; echo "$out"; exit 1; }
            # And the same profile renders once the store is shared.
            helm template t helm-templates/$chart \
              -f helm-templates/$chart/resource-profiles/prod.yaml \
              --set redis.addresses=redis:6379 >/dev/null
          done
      - name: Regenerate the manifests and the chart CRDs
        run: make sync-helm-crds
      - name: Fail on drift between the generated files and the commit
        run: |
          if ! git diff --exit-code -- config/rbac config/crd/bases helm-templates/ratelimit-operator/templates; then
            echo "::error::generated manifests drifted from the commit: run 'make sync-helm-crds' and commit the result"
            exit 1
          fi
