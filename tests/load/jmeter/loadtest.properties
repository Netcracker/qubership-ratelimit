# JMeter properties the load test plan needs, passed with -q. The results go
# to a CSV file whose timeStamp is the start of each sample, with the sample
# variables loadkit verify reads after JMeter's own columns.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.print_field_names=true
sampleresult.timestamp.start=true
sample_variables=user,group,kind,remaining,lag

# A thread keeps its HTTP client, and with it its keep-alive connection,
# from one iteration to the next.
httpclient.reset_state_on_thread_group_iteration=false

summariser.interval=30
