# A routed probe backend. Without it every probe path is unrouted, and this
# gateway answers 503 for admitted traffic on such paths - indistinguishable
# from a gateway that is still starting. With a real route the codes become
# terminal: admitted traffic answers from the backend, a refusal answers 429,
# and 503 means the gateway itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-echo
  labels:
    app: e2e-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-echo
  template:
    metadata:
      labels:
        app: e2e-echo
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-echo
spec:
  selector:
    app: e2e-echo
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2e-echo
spec:
  parentRefs:
    - name: public-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /e2e-
      backendRefs:
        - name: e2e-echo
          port: 8080
