apiVersion: ratelimit.netcracker.com/v1alpha1
kind: RateLimitPolicy
metadata:
  # The name is the domain: object names are unique within a namespace, so this
  # is what makes one policy per domain unrepresentable rather than arbitrated.
  name: gateway.public
  labels:
    app.kubernetes.io/name: ratelimit
spec:
  # Must equal the domain in the rate limit filter of the public gateway, which
  # the Helm chart renders from .Values.gateways[].domain. Nothing validates the
  # match; a typo shows up as an "unknown rate limit domain" line in the service
  # log, which is why that line is written on every check.
  domain: gateway.public

  # Which token claims become descriptor keys. client is built in — the sub
  # claim, lower-cased — and works with no entry at all.
  mappings:
    - { key: roles, claim: realm_access.roles, type: StringArray }

  groups:
    - name: mvno-group-1
      clients: [mvno_acc1, mvno_acc2]

  limits:
    # A cascade: the first matching rule decides, so the order of the list is the
    # meaning. Read it top down as "who is this caller".
    - name: order-management
      target:
        routes:
          - path: { type: Prefix, value: /api/v1/order-management/ }
            methods: [GET]
          - path: { type: Template, value: "/api/v1/orders/{orderId}/items" }
      mode: FirstMatch
      rules:
        # The scraper is exempt from this block and from nothing else: a Bypass
        # rule bypasses its own block, so the ceilings below still apply.
        - name: internal-bypass
          matches:
            - { key: client, operator: Equals, value: prometheus }
          behavior: Bypass

        # Shadow tries a tighter limit over the live one: it counts and records
        # metrics, never rejects, and does not end the cascade.
        - name: mvno-group-1-trial
          matches:
            - { key: client, operator: InGroup, value: mvno-group-1 }
          behavior: Shadow
          rates:
            - { requests: 50, periodSeconds: 60 }

        - name: mvno-group-1
          matches:
            - { key: client, operator: InGroup, value: mvno-group-1 }
          # No axes: the group shares one bucket.
          counters: []
          rates:
            - { requests: 100, periodSeconds: 60, algorithm: FixedWindow }
            - { requests: 10000, periodSeconds: 86400, algorithm: FixedWindow }

        # roles comes from the mappings above. A rule referencing a key nothing
        # declares makes the whole generation invalid — not just this rule — and
        # the status says so with Accepted: False and UnresolvedKeyReference.
        - name: subscriber-per-user
          matches:
            - { key: roles, operator: Contains, value: subscriber }
          counters: [client]
          rates:
            - { requests: 1000, periodSeconds: 60, burst: 100 }

        # No predicate, so it matches every caller who has a client value. An
        # anonymous caller has none, and a rule cannot key a bucket by an axis
        # the request does not carry, so anonymous traffic falls through to the
        # rule below.
        - name: per-user
          counters: [client]
          rates:
            - { requests: 100, periodSeconds: 60 }

        - name: anonymous
          matches:
            - { key: client, operator: DoesNotExist }
          counters: []
          rates:
            - { requests: 100, periodSeconds: 60 }

    # A second block, so its verdict adds to the one above: a request that lands
    # in both has to fit both.
    - name: api-defaults
      target:
        routes:
          - path: { type: Prefix, value: /api/ }
      rules:
        # A smoothed minute next to a daily quota. Each window is an independent
        # bucket, and each can reject on its own.
        - name: per-user
          counters: [client]
          rates:
            - { requests: 300, periodSeconds: 60 }
            - { requests: 20000, periodSeconds: 86400, algorithm: FixedWindow }

        # Two axes, so the bucket is per pair. Under a Prefix route the path axis
        # is the raw request path, so its cardinality is as wide as the traffic;
        # under a Template route it is the template itself.
        - name: per-user-per-path
          counters: [client, path]
          rates:
            - { requests: 60, periodSeconds: 60 }
