---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: ratelimit-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ratelimit.netcracker.com
  resources:
  - ratelimitpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ratelimit.netcracker.com
  resources:
  - ratelimitpolicies/status
  verbs:
  - get
  - patch
  - update
