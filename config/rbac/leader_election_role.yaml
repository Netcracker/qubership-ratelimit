# Permissions to do leader election. The lease lives in the service's own
# namespace, so this stays a Role like the rest of the service's RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: ratelimit
    app.kubernetes.io/managed-by: kustomize
  name: leader-election-role
  namespace: system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
