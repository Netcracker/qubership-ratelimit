    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          RateLimitPolicy is the whole rate limit configuration of one gateway domain.

          The singleton comes out of the naming rule rather than out of arbitration:
          metadata.name equals spec.domain, and object names are unique within a
          namespace, so a second policy for a domain cannot be created. The API server
          rejects it with AlreadyExists, and there is no "which one wins" question to
          answer.

          Everything the domain needs lives in this one object: the claim mapping, the
          groups, and the rules change in one edit and apply atomically, so a request
          never sees old extraction mixed with new rules. The compiler resolves the
          references from rules to keys and groups inside the object, with no
          cross-object arbitration anywhere.

          A generation is enforced whole or not at all. The API server checks only the
          shape — patterns, enums, ranges, duplicate names, and this name rule — while
          everything that relates fields to each other is judged by the compiler on
          every generation and answered through the status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec is the rate limit configuration of the domain the policy is named
              after.
            properties:
              domain:
                description: |-
                  domain binds this policy to a traffic source. It has to equal, byte for
                  byte, the domain the rate limit filter of that gateway sends, and it
                  equals metadata.name. Comparison is case-sensitive.

                  A colon separates the segments of a counter key, braces are Redis
                  Cluster hash tags that decide slot routing, and a slash separates the
                  namespace from the domain inside the tag, so none of them is allowed
                  here. The naming convention is <kind>.<name>: gateway.public,
                  service.billing.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                type: string
              groups:
                description: groups are the named value lists the InGroup operator
                  resolves against.
                items:
                  description: |-
                    Group names a list of values that the InGroup operator matches a key
                    against.
                  properties:
                    name:
                      description: |-
                        name is how a predicate references the group. It is unique within the
                        policy.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$
                      type: string
                    values:
                      description: |-
                        values lists the members of the group. A predicate compares them with
                        the value of its own key after that key's normalization: lower-case for
                        sub unless a mapping entry overrides sub, whose own normalization then
                        applies (None by default); what the mapping entry declares for a
                        mapped key; and a path capture as the segment was sent. The members
                        are compared as written, so their case is the author's responsibility.
                      items:
                        maxLength: 256
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - name
                  - values
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              limits:
                description: limits are the blocks of the policy.
                items:
                  description: |-
                    LimitBlock is a target plus the rules that count the traffic it selects.
                    Blocks always add up: a request that lands in several blocks has to fit the
                    verdict of each.
                  properties:
                    mode:
                      default: All
                      description: |-
                        mode selects how the rules of the block combine; it has no effect across
                        blocks. All applies every rule that matches. FirstMatch applies the
                        first rule that matches, in the order of the rules list, so the order is
                        part of the meaning. Defaults to All.
                      enum:
                      - All
                      - FirstMatch
                      type: string
                    name:
                      description: name is unique within its policy and is part of
                        the counter key.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$
                      type: string
                    rules:
                      description: rules are the counters of the block.
                      items:
                        description: Rule is one counter of a block.
                        properties:
                          behavior:
                            default: Enforce
                            description: |-
                              behavior selects what the rule does with the verdict. Enforce counts the
                              request and can refuse it. Shadow counts the request and records its
                              metrics but never refuses, and in a FirstMatch block it does not end
                              the cascade; it is how a tighter limit is tried out over a live one.
                              Bypass ends the cascade of its own block with a pass and counts
                              nothing; the other blocks of the policy still apply. Defaults to
                              Enforce.
                            enum:
                            - Enforce
                            - Shadow
                            - Bypass
                            type: string
                          counters:
                            description: |-
                              counters are the axes of the bucket. An empty list gives the rule a
                              single shared bucket. A rule whose axis the request does not carry, such
                              as sub for an anonymous caller, does not match: there is nothing to
                              key the bucket by.
                            items:
                              maxLength: 63
                              pattern: ^[a-z][a-zA-Z0-9_]*$
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          matches:
                            description: |-
                              matches is a conjunction of predicates. An empty list matches every
                              request the block sees.
                            items:
                              description: |-
                                Predicate is one condition on the identity of the caller. Paths and methods
                                belong in the target of the block, so a predicate cannot name them.

                                The compiler checks the parameters against the operator and reports a
                                mismatch as an InvalidSpec problem. It is not a CEL rule on the schema: the
                                cost estimator charges every rule the product of the list bounds on the way
                                to it, so keeping these checks at admission would mean bounding every list
                                for the estimator's sake and maintaining a second copy of the compiler.
                              properties:
                                key:
                                  description: |-
                                    key names the descriptor key the predicate reads: sub, a mappings
                                    key, or a capture of the block's own Template routes.
                                  maxLength: 63
                                  minLength: 1
                                  pattern: ^[a-z][a-zA-Z0-9_]*$
                                  type: string
                                operator:
                                  description: |-
                                    operator is the predicate applied to the value set of the key: one
                                    value for a scalar key, the elements for an array key, and none for a
                                    key the request does not carry. Equals holds when the set is exactly
                                    value, and is rejected for an array key. In holds when the set shares a
                                    member with values. InGroup holds when the set shares a member with the
                                    group that value names. Contains holds when value is a member of the
                                    set; it never means substring. Exists holds when the set is not empty.
                                    DoesNotExist holds when it is empty, which is how anonymous traffic is
                                    selected.
                                  enum:
                                  - Equals
                                  - In
                                  - InGroup
                                  - Contains
                                  - Exists
                                  - DoesNotExist
                                  type: string
                                value:
                                  description: |-
                                    value is the operand of Equals, Contains, and InGroup. For InGroup it is
                                    the name of a group.
                                  maxLength: 256
                                  minLength: 1
                                  type: string
                                values:
                                  description: values is the operand of In.
                                  items:
                                    maxLength: 256
                                    type: string
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          name:
                            description: name is unique within its block and is part
                              of the counter key.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$
                            type: string
                          rates:
                            description: |-
                              rates are the counting windows of the rule, keyed by period. A rule with
                              behavior Bypass carries none; every other rule carries at least one.
                            items:
                              description: |-
                                Rate is one counting window of a rule. Windows of a rule are independent
                                buckets, so a rate limit and a quota live side by side.
                              properties:
                                algorithm:
                                  default: GCRA
                                  description: |-
                                    algorithm selects how the window counts, and is a property of the
                                    window rather than of the rule. GCRA meters requests at a steady rate
                                    with burst as the allowance, so a refused caller can retry once a
                                    fraction of the period has passed. FixedWindow counts requests per
                                    wall-clock window and resets at its boundary, which suits a quota.
                                    Defaults to GCRA.
                                  enum:
                                  - GCRA
                                  - FixedWindow
                                  type: string
                                burst:
                                  description: |-
                                    burst is the bucket depth of a GCRA window. It defaults to requests,
                                    which is a full bucket, and a FixedWindow entry that sets it is rejected
                                    by the compiler.
                                  format: int32
                                  maximum: 2147483647
                                  minimum: 1
                                  type: integer
                                periodSeconds:
                                  description: |-
                                    periodSeconds is the length of the window. A day is the ceiling: beyond
                                    it a counter stops being a rate limit and becomes an accounting record.
                                  format: int32
                                  maximum: 86400
                                  minimum: 1
                                  type: integer
                                requests:
                                  description: requests is the quota of the window.
                                  format: int32
                                  maximum: 2147483647
                                  minimum: 1
                                  type: integer
                              required:
                              - periodSeconds
                              - requests
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - periodSeconds
                            x-kubernetes-list-type: map
                          replacedRules:
                            description: |-
                              replacedRules silences rules of the same block, which is how a narrow
                              rule overrides a broad one. It is available only in an All block, where
                              the order of the list carries no meaning of its own. A rule with
                              behavior Shadow silences nothing, so the rules it names keep enforcing
                              until it is switched to Enforce.
                            items:
                              maxLength: 63
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - name
                        type: object
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    target:
                      description: |-
                        target restricts the block. An absent target lets the block see the whole
                        domain.
                      properties:
                        routes:
                          description: routes is an OR-list. A block without a target
                            sees the whole domain.
                          items:
                            description: |-
                              Route selects request traffic for a block. The fields of one route combine
                              with AND; the routes of a target combine with OR.
                            properties:
                              cost:
                                description: |-
                                  cost reads the cost of a request matched through this route from the
                                  request, and every window of the block charges that many units instead
                                  of one. The first route of the target that matches a request decides its
                                  cost. Without it a request through the gateway costs one unit.
                                properties:
                                  default:
                                    description: |-
                                      default is the cost of a request without a usable value: the parameter
                                      absent, empty, zero, or anything but decimal digits. It defaults to 1;
                                      the default page size of the API is the usual value.
                                    format: int32
                                    maximum: 1000000000
                                    minimum: 1
                                    type: integer
                                  name:
                                    description: |-
                                      name is the parameter name, compared with the percent-decoded name in
                                      the query string, case-sensitively. A value that is a positive decimal
                                      integer is the cost, and a value above 1000000000 costs 1000000000. The
                                      largest of several occurrences is the cost.
                                    maxLength: 64
                                    minLength: 1
                                    pattern: ^[A-Za-z0-9_.\-\[\]]+$
                                    type: string
                                  source:
                                    description: |-
                                      source is where the value is read from. QueryParameter is the only
                                      source.
                                    enum:
                                    - QueryParameter
                                    type: string
                                required:
                                - name
                                - source
                                type: object
                              methods:
                                description: |-
                                  methods accepts a request whose method is one of the listed values. An
                                  absent list accepts any method.
                                items:
                                  description: HTTPMethod is one request method a
                                    route accepts.
                                  enum:
                                  - GET
                                  - HEAD
                                  - POST
                                  - PUT
                                  - PATCH
                                  - DELETE
                                  - CONNECT
                                  - OPTIONS
                                  - TRACE
                                  type: string
                                type: array
                                x-kubernetes-list-type: set
                              path:
                                description: path selects request paths.
                                properties:
                                  type:
                                    description: |-
                                      type selects how value is compared with the request path. Exact compares
                                      the whole path, byte for byte, with the query already stripped and no
                                      normalization, so /orders and /orders/ differ. Prefix compares leading
                                      segments and stops at a slash or at the end of the path: /api/v1/orders
                                      covers /api/v1/orders/42 but not /api/v1/orders-archive, unlike the
                                      character prefix match of an Envoy route. Template compares segment by
                                      segment, where {name} matches exactly one non-empty segment and becomes
                                      a descriptor key of the block.
                                    enum:
                                    - Exact
                                    - Prefix
                                    - Template
                                    type: string
                                  value:
                                    description: |-
                                      value is the path, the prefix, or the template. It starts with a slash;
                                      the query string of a request is cut before matching, so it never appears
                                      here.
                                    maxLength: 2048
                                    minLength: 1
                                    pattern: ^/
                                    type: string
                                required:
                                - type
                                - value
                                type: object
                            required:
                            - path
                            type: object
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - routes
                      type: object
                  required:
                  - name
                  - rules
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              mappings:
                description: |-
                  mappings declare which token claims become descriptor keys. An empty
                  list leaves the domain with its built-in keys, sub among them.
                items:
                  description: ClaimMapping turns one JWT claim into one descriptor
                    key.
                  properties:
                    claim:
                      description: |-
                        claim is a dotted path into the payload, such as realm_access.roles.
                        Exactly one of claim and claimPath is set.
                      maxLength: 256
                      minLength: 1
                      type: string
                    claimPath:
                      description: |-
                        claimPath is the same path given segment by segment, which is how a
                        claim name that itself contains a dot is addressed.
                      items:
                        maxLength: 256
                        minLength: 1
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    fallbacks:
                      description: |-
                        fallbacks are dotted paths tried in order when the primary path yields
                        nothing. The first non-empty result wins.
                      items:
                        maxLength: 256
                        minLength: 1
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    key:
                      description: |-
                        key names the descriptor key the rules reference. It uses the one
                        descriptor key pattern of this API, camelCase included; path, method and
                        token are produced by the engine and cannot be redefined, while sub
                        is an allowed override.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z][a-zA-Z0-9_]*$
                      type: string
                    normalization:
                      default: None
                      description: |-
                        normalization is applied to the extracted value before it is compared
                        or put into a counter key. None keeps the value as the token carries
                        it. Lowercase lower-cases it, which makes the comparison case-insensitive
                        for values written in lower case. Defaults to None.
                      enum:
                      - None
                      - Lowercase
                      type: string
                    type:
                      default: String
                      description: |-
                        type is the shape of the extracted value. String extracts one value, so
                        the key can be a counter axis. StringArray extracts a list, which In,
                        InGroup, Contains, Exists, and DoesNotExist read as a set; Equals is
                        rejected for it, and it cannot be a counter axis. Defaults to String.
                      enum:
                      - String
                      - StringArray
                      type: string
                  required:
                  - key
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
            required:
            - domain
            - limits
            type: object
          status:
            description: |-
              status is what the operator observed: whether the latest generation
              compiles, which generation the service replicas enforce, and the
              problems of the latest generation.
            properties:
              activeGeneration:
                description: |-
                  activeGeneration is the generation actually being enforced. It falls
                  behind observedGeneration when the latest edit does not compile and the
                  last-good generation keeps running. Zero means the domain is unprotected:
                  no generation is in effect at all.
                format: int64
                type: integer
              conditions:
                description: conditions holds the latest observations of the policy
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveKeys:
                description: |-
                  effectiveKeys is the domain-wide key set of activeGeneration: the
                  built-in keys plus the mapped ones. Route captures are per block and do
                  not appear here. It reports what is in effect rather than what was asked
                  for, so a rule author reads the set their rules actually resolve against.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: observedGeneration is the latest spec generation the
                  leader has seen.
                format: int64
                type: integer
              problems:
                description: |-
                  problems is how many problems the latest generation has, which a printer
                  column can show and a JSONPath expression cannot compute. It counts every
                  one, including those past the 64 entries ruleProblems holds.
                format: int32
                type: integer
              replicas:
                description: replicas is what the leader observed about the fleet.
                properties:
                  applied:
                    description: applied is how many ready replicas enforce status.activeGeneration.
                    format: int32
                    type: integer
                  lastCheckTime:
                    description: |-
                      lastCheckTime is the freshness of the probe. When no pod exists at all
                      there is nobody to write the status, and the age of this stamp is what
                      shows it.
                    format: date-time
                    type: string
                  summary:
                    description: |-
                      summary is applied and total as "2/3", and exists because the REPLICAS
                      printer column has to read one field: a column is a JSONPath expression,
                      and JSONPath cannot join two numbers. It is written by the leader
                      alongside the two numbers and carries nothing they do not.
                    maxLength: 32
                    type: string
                  total:
                    description: total is the number of ready replicas at the time
                      of the probe.
                    format: int32
                    type: integer
                type: object
              ruleProblems:
                description: |-
                  ruleProblems lists the diagnostics of the latest generation. A blocking
                  entry invalidates that generation whole: Accepted goes false, Ready goes
                  false with reason NotCompiled, and the last-good generation keeps running
                  where there is one. An informational entry, such as
                  CaptureShadowsMappedKey, leaves both alone — a fact to alert on rather
                  than a failure of the object. Past 64 entries the list is cut, the
                  blocking entries kept first; problems holds the full count.
                items:
                  description: |-
                    RuleProblem describes what is wrong with one rule. Problems live outside
                    conditions because conditions are a map keyed by type, and a generation can
                    hold several problems at once.

                    The list carries root causes only, never the cascade of every rule in an
                    invalid generation: the author needs the reference that does not resolve, not
                    a restatement of the atomicity rule once per rule.
                  properties:
                    block:
                      description: |-
                        block names the block the rule belongs to. It is empty for a problem of
                        the policy as a whole, such as the decision budget.
                      type: string
                    message:
                      description: message says what the rule references and what
                        the domain offers.
                      maxLength: 1024
                      type: string
                    reason:
                      description: |-
                        reason is one of UnresolvedKeyReference, UnresolvedGroupReference,
                        UnresolvedReplacedRules, IncompatibleOperator, InvalidCounterAxis,
                        InvalidSpec, InvalidWindow, DomainBudgetExceeded,
                        CaptureShadowsMappedKey, and CostExceedsCapacity.
                        CaptureShadowsMappedKey and CostExceedsCapacity are informational; every
                        other reason blocks the generation.
                      type: string
                    rule:
                      description: rule names the rule, empty for a block-level or
                        policy-level problem.
                      type: string
                  required:
                  - reason
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              rules:
                description: |-
                  rules is how many rules the active generation contributes, which a
                  printer column can show and a JSONPath expression cannot compute.
                format: int32
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name has to equal spec.domain: the policy is the singleton
            of its domain'
          rule: self.metadata.name == self.spec.domain
    served: true
    storage: true
    subresources:
