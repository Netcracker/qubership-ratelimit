# ============== IMAGE ============================
image:
  repository: ghcr.io/netcracker/ratelimit
  tag: latest
  pullPolicy: IfNotPresent

# ============== SERVICE ============================
# Components this Deployment runs: all, controller or rls. Controller and RLS
# engine share one binary today; the flag exists so that splitting them into two
# Deployments is a values change rather than a code change.
mode: all

# REPLICAS, CPU_REQUEST, MEMORY_REQUEST, CPU_LIMIT and MEMORY_LIMIT are set by
# the resource profile, not here — one source of truth, so the defaults cannot
# drift away from the profiles. values.schema.json requires them, so installing
# without `-f resource-profiles/<profile>.yaml` fails with a clear message
# instead of rendering a Deployment with empty resources.

# Leader election gates status writes only. The rate limit endpoint and its rule
# store run on every replica, so scaling out does not depend on this setting.
leaderElect: true

# Passed as LOGGING_LEVEL_ROOT: the platform logger resolves its root level
# from the logging.level.root property; LOG_LEVEL only applies before the
# configloader is initialized.
logLevel: info

# ============== RATE LIMIT SERVICE ============================
rls:
  port: 9000
  timeout: 0.05s
  # What an unreachable limiter means for the traffic of this gateway. It is a
  # gateway decision rather than a service one, which is why it lives on the
  # filter: false keeps the traffic flowing unlimited, true rejects it.
  failClosed: false
  # The service supplies x-ratelimit-limit, x-ratelimit-remaining,
  # x-ratelimit-reset and retry-after itself, as ready response headers.
  # DRAFT_VERSION_03 would additionally let Envoy render X-RateLimit-* from
  # per-descriptor statuses — which the service does not populate — so OFF is
  # the honest default: the flag currently changes nothing, and the headers
  # keep coming from the one place that computes them.
  xRateLimitHeaders: "OFF"

# ============== COUNTER STORE ============================
# Redis holds the counters, and that is what makes a limit a limit of the domain
# rather than of each replica: with N replicas counting in their own memory, a
# limit of 100 admits 100*N. An empty address list selects the in-process store,
# which is correct at one replica and for a developer install.
#
# addresses is a comma-separated host:port list: one entry is a standalone server,
# several are a cluster. Setting masterName selects Sentinel.
redis:
  addresses: ""
  db: 0
  username: ""
  masterName: ""
  # The password comes from a Secret rather than from values: values end up in
  # the release, and the release is readable by anyone with get on Secrets in the
  # namespace.
  existingSecret: ""
  passwordKey: password

healthProbe:
  port: 8081

ISTIO_PUBLIC_GATEWAY_NAME: public-gateway
ISTIO_PRIVATE_GATEWAY_NAME: private-gateway

# What this chart owns per gateway: whether to rate limit it, and under which
# domain. The domain is the binding key — it must equal spec.domain of the
# RateLimitPolicy that carries this gateway's rules. Nothing validates the match;
# a typo shows up only as an "unknown rate limit domain" line in the service log.
#
# namespace is optional and defaults to the release namespace.
gateways:
  public:
    enabled: true
    domain: gateway.public
  private:
    enabled: true
    domain: gateway.private

# ============== KUBERNETES ============================
serviceAccount:
  create: true
  # Defaults to the chart's fullname when empty.
  name: ""


podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
