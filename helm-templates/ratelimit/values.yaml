# ============== IMAGE ============================
image:
  repository: ghcr.io/netcracker/ratelimit
  tag: latest
  pullPolicy: IfNotPresent

# ============== SERVICE ============================
# Components this Deployment runs: all, controller or rls. Controller and RLS
# engine share one binary today; the flag exists so that splitting them into two
# Deployments is a values change rather than a code change.
mode: all

# REPLICAS, CPU_REQUEST, MEMORY_REQUEST, CPU_LIMIT and MEMORY_LIMIT are set by
# the resource profile, not here — one source of truth, so the defaults cannot
# drift away from the profiles. values.schema.json requires them, so installing
# without `-f resource-profiles/<profile>.yaml` fails with a clear message
# instead of rendering a Deployment with empty resources.

# Leader election gates status writes only. The rate limit endpoint and its rule
# store run on every replica, so scaling out does not depend on this setting.
leaderElect: true

# Passed as LOGGING_LEVEL_ROOT: the platform logger resolves its root level
# from the logging.level.root property; LOG_LEVEL only applies before the
# configloader is initialized.
logLevel: info

# ============== RATE LIMIT SERVICE ============================
rls:
  port: 9000
  timeout: 0.05s
  failClosed: false

healthProbe:
  port: 8081

ISTIO_PUBLIC_GATEWAY_NAME: public-gateway
ISTIO_PRIVATE_GATEWAY_NAME: private-gateway

# What this chart owns per gateway: whether to rate limit it, and under which
# domain. The domain is the binding key — it must equal spec.domain of the
# RateLimitPolicy that carries this gateway's rules. Nothing validates the match;
# a typo shows up only as an "unknown rate limit domain" line in the service log.
#
# namespace is optional and defaults to the release namespace.
gateways:
  public:
    enabled: true
    domain: gateway.public
  private:
    enabled: true
    domain: gateway.private

# ============== KUBERNETES ============================
serviceAccount:
  create: true
  # Defaults to the chart's fullname when empty.
  name: ""


podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
