{{- $mgmt := (include "ratelimit.management" . | fromYaml) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ratelimit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratelimit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      appProtocol: grpc
      port: {{ .Values.rls.port }}
      targetPort: grpc
      protocol: TCP
    {{- if $mgmt.enabled }}
    # The management API. A ClusterIP port is how a UI or an engineer reaches
    # it; no gateway routes to it, which is what keeps it off the data path.
    - name: management
      appProtocol: http
      port: {{ $mgmt.port }}
      targetPort: management
      protocol: TCP
    {{- end }}
  selector:
    {{- include "ratelimit.selectorLabels" . | nindent 4 }}
