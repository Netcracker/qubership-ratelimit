{{- if .Values.MONITORING_ENABLED }}
{{- $namespaceHash := sha256sum .Release.Namespace | trunc 6 }}
{{- $dashboardNamespace := .Release.Namespace | trunc 18 | trimSuffix "-" }}
{{- /*
The uid must be unique per installation and at most 40 characters: Grafana
rejects longer ones at import. A truncated namespace alone can collide, so a
hash of the full name rides along.
*/}}
{{- $dashboardUID := printf "%s-%s-ratelimit" $dashboardNamespace $namespaceHash }}
{{- /*
Auto-refresh stays off on purpose: a dashboard that repaints itself while an
incident is being read replaces the evidence mid-investigation. Refresh by
hand when newer samples are needed.
*/}}
---
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: {{ printf "%s-dashboard" (include "ratelimit.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    app: grafana
    {{- include "ratelimit.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  name: {{ printf "%s-dashboard" (include "ratelimit.fullname" .) | trunc 63 | trimSuffix "-" }}.json
  json: {{ .Files.Get "dashboards/ratelimit-dashboard.json" | toJson | replace "dashboard-uid-placeholder" $dashboardUID | replace "namespace-default-placeholder" .Release.Namespace }}
{{- end }}
