{{- include "ratelimit.validateDomains" . -}}
{{- $root := . -}}
{{- $cluster := include "ratelimit.rlsCluster" . -}}
{{- $roles := dict
      "public"  (dict "gatewayName" $root.Values.ISTIO_PUBLIC_GATEWAY_NAME  "config" $root.Values.gateways.public)
      "private" (dict "gatewayName" $root.Values.ISTIO_PRIVATE_GATEWAY_NAME "config" $root.Values.gateways.private)
-}}
{{- range $role, $entry := $roles }}
{{- $config := $entry.config | default dict }}
{{- if $config.enabled }}
{{- $gatewayName := required (printf "gateways.%s is enabled, so ISTIO_%s_GATEWAY_NAME must be set" $role (upper $role)) $entry.gatewayName }}
{{- $namespace := $config.namespace | default $root.Release.Namespace }}
{{- /* Per-gateway overrides of the rls.* defaults. Booleans go through hasKey
       because `default` would swallow an explicit false. */}}
{{- $timeout := $config.timeout | default $root.Values.rls.timeout }}
{{- $failClosed := ternary $config.failClosed $root.Values.rls.failClosed (hasKey $config "failClosed") }}
{{- $limitedStatus := $config.rateLimitedStatus | default $root.Values.rls.rateLimitedStatus }}
{{- $resourceExhausted := ternary $config.grpcAsResourceExhausted $root.Values.rls.grpcAsResourceExhausted (hasKey $config "grpcAsResourceExhausted") }}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ printf "%s-%s" (include "ratelimit.fullname" $root) $gatewayName | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "ratelimit.labels" $root | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
            domain: {{ $config.domain }}
            failure_mode_deny: {{ $failClosed }}
            {{- if $failClosed }}
            {{- /* Without this a deny answers with Envoy's default 500, which
                   reads as a gateway bug rather than a dependency outage. */}}
            status_on_error:
              code: 503
            {{- end }}
            timeout: {{ $timeout }}
            {{- /* Quoted: bare OFF is a YAML boolean, and the field is a string enum. */}}
            enable_x_ratelimit_headers: {{ $root.Values.rls.xRateLimitHeaders | quote }}
            rate_limited_status:
              code: {{ $limitedStatus }}
            rate_limited_as_resource_exhausted: {{ $resourceExhausted }}
            stat_prefix: {{ include "ratelimit.statPrefix" $gatewayName }}
            {{- /* The emergency pair: runtime fractions Envoy re-reads live,
                   so an operator can disable or dry-run the filter without a
                   redeploy. */}}
            filter_enabled:
              runtime_key: ratelimit.{{ $gatewayName }}.enabled
              default_value:
                numerator: {{ $root.Values.runtime.enabledPercent }}
                denominator: HUNDRED
            filter_enforced:
              runtime_key: ratelimit.{{ $gatewayName }}.enforced
              default_value:
                numerator: {{ $root.Values.runtime.enforcedPercent }}
                denominator: HUNDRED
            rate_limit_service:
              transport_api_version: V3
              grpc_service:
                envoy_grpc:
                  cluster_name: {{ $cluster }}
                  authority: {{ include "ratelimit.rlsAuthority" $root }}
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
      patch:
        operation: MERGE
        value:
          rate_limits:
            - actions:
                - request_headers:
                    header_name: ":path"
                    descriptor_key: path
                - request_headers:
                    header_name: ":method"
                    descriptor_key: method
                - request_headers:
                    header_name: "authorization"
                    descriptor_key: token
                    skip_if_absent: true
                - request_headers:
                    header_name: "x-request-id"
                    descriptor_key: request_id
                    skip_if_absent: true
{{- end }}
{{- end }}
