apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ratelimit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratelimit.labels" . | nindent 4 }}
rules:
  # Leader election. The lease is always in the service's own namespace, and it
  # gates status writes only.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Leader election records who took the lease as an Event in this namespace.
  # Without this the service still works, but every handover logs an API
  # rejection that looks like a real failure.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [ratelimit.netcracker.com]
    resources: [ratelimitpolicies, ratelimitmappings]
    verbs: [get, list, watch]
  - apiGroups: [ratelimit.netcracker.com]
    resources: [ratelimitpolicies/status, ratelimitmappings/status]
    verbs: [get, update, patch]
  # The last-good spec of every object of a domain, so that a restart does not
  # forget which generation is being enforced. Names are ratelimit-state-<domain>
  # and the domains are only known at run time, so the rule cannot be narrowed to
  # resourceNames.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch, delete]
