apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ratelimit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratelimit.labels" . | nindent 4 }}
rules:
  # Leader election. The lease is always in the service's own namespace, and it
  # gates status writes only.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Leader election records who took the lease as an Event in this namespace,
  # and the state store records what it wrote. Without these the service still
  # works, but every handover logs an API rejection that looks like a real
  # failure.
  #
  # Both API groups are granted because both are used: leader election writes
  # through the legacy core events API, and the state store writes through
  # events.k8s.io.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [ratelimit.netcracker.com]
    resources: [ratelimitpolicies]
    verbs: [get, list, watch]
  # The leader asks every ready endpoint of this Service which generation it
  # enforces, which is what makes the Ready condition a statement about the
  # fleet rather than about the leader alone.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [ratelimit.netcracker.com]
    resources: [ratelimitpolicies/status]
    verbs: [get, update, patch]
  # The last-good spec of every object of a domain, so that a restart does not
  # forget which generation is being enforced. Names are ratelimit-state-<domain>
  # and the domains are only known at run time, so the rule cannot be narrowed to
  # resourceNames. list is label-scoped discovery: a new leader sweeps the state
  # of domains that retired while somebody else held the lease.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
