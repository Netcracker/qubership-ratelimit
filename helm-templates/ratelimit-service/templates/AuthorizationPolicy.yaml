{{- if ne (include "ratelimit.mode" .) "satellite" }}
{{- if and .Values.management.enabled .Values.management.authorizationPolicy.enabled }}
{{- /* The principals: allowedServiceAccounts in NAMESPACE when it is set,
       the callers otherwise, <name> in NAMESPACE and <namespace>/<name> in
       its own namespace. */}}
{{- $principals := list }}
{{- range .Values.management.authorizationPolicy.allowedServiceAccounts }}
{{- $principals = append $principals (printf "cluster.local/ns/%s/sa/%s" $.Values.NAMESPACE .) }}
{{- end }}
{{- if not $principals }}
{{- range .Values.management.callers }}
{{- $parts := splitList "/" . }}
{{- if eq (len $parts) 2 }}
{{- $principals = append $principals (printf "cluster.local/ns/%s/sa/%s" (index $parts 0) (index $parts 1)) }}
{{- else }}
{{- $principals = append $principals (printf "cluster.local/ns/%s/sa/%s" $.Values.NAMESPACE .) }}
{{- end }}
{{- end }}
{{- end }}
# Who may reach the management port.
#
# The service verifies every token, so this policy is the second check rather
# than the only one: it keeps the port to the workloads that call it, and a
# token copied out of a listed caller does not open it to another workload.
#
# DENY with notPrincipals rather than ALLOW: an ALLOW policy applies to the
# whole workload, so it would have to enumerate the gRPC and metrics ports as
# well, and a port left out of that list would stop answering. This one names a
# single port and leaves the reachability of the others exactly as it was.
#
# It is enforced by ztunnel, so it holds only while the pod is in the mesh. A
# namespace without ambient redirection or a sidecar gets a policy that matches
# nothing, and the port is open — check the dataplane mode before relying on it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: '{{ .Values.SERVICE_NAME }}-management'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
  selector:
    matchLabels:
      name: '{{ .Values.SERVICE_NAME }}'
  action: DENY
  rules:
    - to:
        - operation:
            ports:
              - "8082"
      from:
        - source:
            notPrincipals:
              {{- range $principals }}
              - {{ . }}
              {{- end }}
{{- end }}
{{- end }}
