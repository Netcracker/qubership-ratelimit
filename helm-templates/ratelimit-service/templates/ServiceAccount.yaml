{{- if ne (include "ratelimit.mode" .) "satellite" }}
# No Role is bound to it, so its token, which the pod mounts only for the
# management API, reads no API server object. The account exists so the pod
# runs under an identity of its own, which is what the mesh's policies name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ .Values.SERVICE_NAME }}'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
automountServiceAccountToken: false
{{- end }}
