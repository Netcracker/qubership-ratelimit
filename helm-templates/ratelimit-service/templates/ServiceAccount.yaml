{{- if ne (include "ratelimit.mode" .) "satellite" }}
{{- if .Values.serviceAccount.create }}
# No Role is bound to it, and no token is mounted: the data plane holds no
# Kubernetes credentials. The account exists so the pod runs under an identity
# of its own, which is what the mesh's policies name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ .Values.serviceAccount.name | default .Values.SERVICE_NAME }}'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID | default "unimplemented" }}'
automountServiceAccountToken: false
{{- end }}
{{- end }}
