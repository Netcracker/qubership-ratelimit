{{- /*
The counter store's connection. The DatabaseSecretClaim asks dbaas-operator to
look up the database the InternalDatabase declares, by the same classifier
(ratelimit.dbaasClassifier), and write its connection properties into the
Secret the Deployment mounts. Its app.kubernetes.io/name label is the chart's
name, which dbaas-operator sends as the originService of the lookup and which
equals the classifier's microserviceName, so the database's owner is the
service that reads it.

It renders only where the cluster serves the kind, so an install on a cluster
without dbaas-operator's CRDs does not fail on it; see
ratelimit.dbaasDeclared for the other conditions.
*/ -}}
{{- if and (include "ratelimit.dbaasDeclared" .) (.Capabilities.APIVersions.Has "dbaas.netcracker.com/v1/DatabaseSecretClaim") }}
apiVersion: dbaas.netcracker.com/v1
kind: DatabaseSecretClaim
metadata:
  name: {{ include "ratelimit.redisSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratelimit.labels" . | nindent 4 }}
spec:
  operatorNamespace: {{ include "ratelimit.dbaasNamespace" . | quote }}
  {{- include "ratelimit.dbaasClassifier" . | nindent 2 }}
  type: redis
  secretName: {{ include "ratelimit.redisSecretName" . }}
{{- end }}
