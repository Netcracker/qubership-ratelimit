{{- /*
The claim on the counter store that InternalDatabase.yaml declares: it asks
dbaas-operator to look that database up by classifier and type, and to write
its connection properties into the Secret the Deployment mounts. The claim
therefore carries the database's classifier, type, and operatorNamespace,
which InternalDatabase.yaml explains. The operator sends the claim's
app.kubernetes.io/name label as the originService of the lookup; the label
equals microserviceName, so the service that reads the database is its owner.
The claim renders under the same conditions as the database.
*/ -}}
{{- if ne (include "ratelimit.mode" .) "satellite" }}
{{- if .Values.redis.dbaas.enabled }}
apiVersion: dbaas.netcracker.com/v1
kind: DatabaseSecretClaim
metadata:
  name: '{{ .Values.SERVICE_NAME }}-redis'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
  operatorNamespace: {{ include "ratelimit.dbaasNamespace" . | quote }}
  classifier:
    microserviceName: '{{ .Values.SERVICE_NAME }}'
    scope: service
    namespace: '{{ .Values.NAMESPACE }}'
  type: redis
  secretName: '{{ .Values.SERVICE_NAME }}-redis'
{{- end }}
{{- end }}
