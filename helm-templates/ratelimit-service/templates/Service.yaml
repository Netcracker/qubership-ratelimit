{{- if ne (include "ratelimit.mode" .) "satellite" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ratelimit.serviceName" . }}
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID | default "unimplemented" }}'
spec:
  type: ClusterIP
  ports:
    # appProtocol is not decoration: without it Istio decides the port is
    # HTTP/1.1, and the gateways' gRPC checks fail.
    - name: grpc
      appProtocol: grpc
      port: {{ include "ratelimit.grpcPort" . }}
      targetPort: grpc
      protocol: TCP
    # The operator takes this port from the EndpointSlice by its name and
    # reads /debug/applied on it, which is how Ready on a policy becomes a
    # statement about every ready replica.
    - name: metrics
      appProtocol: http
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- if .Values.management.enabled }}
    - name: management
      appProtocol: http
      port: {{ .Values.management.port }}
      targetPort: management
      protocol: TCP
    {{- end }}
  selector:
    name: '{{ .Values.SERVICE_NAME }}'
{{- end }}
