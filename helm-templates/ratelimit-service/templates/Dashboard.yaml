{{- if ne (include "ratelimit.mode" .) "satellite" }}
{{- if .Values.MONITORING_ENABLED }}
{{- $namespaceHash := sha256sum .Values.NAMESPACE | trunc 6 }}
{{- $dashboardNamespace := .Values.NAMESPACE | trunc 18 | trimSuffix "-" }}
{{- /*
The uid must be unique per installation and at most 40 characters: Grafana
rejects longer ones at import. A truncated namespace alone can collide, so a
hash of the full name rides along.
*/}}
{{- $dashboardUID := printf "%s-%s-ratelimit" $dashboardNamespace $namespaceHash }}
{{- /*
Auto-refresh stays off on purpose: a dashboard that repaints itself while an
incident is being read replaces the evidence mid-investigation. Refresh by
hand when newer samples are needed.
*/}}
---
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: '{{ .Values.SERVICE_NAME }}-dashboard'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app: grafana
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    app.kubernetes.io/component: monitoring
spec:
  name: '{{ .Values.SERVICE_NAME }}-dashboard.json'
  json: {{ .Files.Get "dashboards/ratelimit-dashboard.json" | toJson | replace "dashboard-uid-placeholder" $dashboardUID | replace "namespace-default-placeholder" .Values.NAMESPACE }}
{{- end }}
{{- end }}
