# ============== PLATFORM ============================
# The parameters the platform sets on every one of its services, read the way
# its other services read them. The defaults are for an installation without
# them, except NAMESPACE, TAG, and DEPLOYMENT_SESSION_ID, which every
# installation sets.
#
# The name of the Deployment and the ServiceAccount, the app.kubernetes.io/name
# and name labels, and the microserviceName of the counter store's DBaaS
# classifier. The Service keeps its fixed name, ratelimit: a satellite's
# filters compute the RLS address from it and cannot know how the baseline was
# named.
SERVICE_NAME: ratelimit-service
# The namespace every object lands in. Required, with no default: the platform
# sets it to the namespace it installs into, and a manual helm install sets it
# to the namespace it passes as -n.
NAMESPACE: ""
# The image. TAG is required, with no default. A floating tag such as "latest"
# moves under a running workload, so two pods of one rollout can end up on
# different builds.
IMAGE_REPOSITORY: ghcr.io/netcracker/qubership-ratelimit-service
TAG: ""
# Labels: app.kubernetes.io/part-of, app.kubernetes.io/managed-by,
# app.kubernetes.io/version (empty renders an empty label), and
# deployment.netcracker.com/sessionId (required, with no default: the platform
# sets it to the deployment session).
APPLICATION_NAME: ratelimit
MANAGED_BY: Helm
ARTIFACT_DESCRIPTOR_VERSION: ""
DEPLOYMENT_SESSION_ID: ""
# On KUBERNETES the container runs as group 10001, and its root filesystem is
# read-only while READONLY_CONTAINER_FILE_SYSTEM_ENABLED is true; on OPENSHIFT
# the platform assigns the user and the group, and the root filesystem is
# writable.
PAAS_PLATFORM: KUBERNETES
READONLY_CONTAINER_FILE_SYSTEM_ENABLED: true
# The rollout, DEPLOYMENT_STRATEGY_TYPE, is not set here. Unset and
# ramped_slow_rollout replace one pod at a time and keep the old one until the
# new one is Ready; recreate and best_effort_controlled_rollout stop the old
# pods first, and custom_rollout takes DEPLOYMENT_STRATEGY_MAXSURGE and
# DEPLOYMENT_STRATEGY_MAXUNAVAILABLE, 25% each by default.
#
# The delay before the first liveness probe.
LIVENESS_PROBE_INITIAL_DELAY_SECONDS: 15

# ============== SERVICE ============================
# REPLICAS, CPU_REQUEST, MEMORY_REQUEST, CPU_LIMIT and MEMORY_LIMIT are set by
# the resource profile, not here: one source of truth, so the defaults cannot
# drift away from the profiles. values.schema.json requires them, so installing
# without `-f resource-profiles/<profile>.yaml` fails with a clear message
# instead of rendering a Deployment with empty resources.
#
# The profile also sets the HPA_* parameters of the HorizontalPodAutoscaler,
# the platform's autoscaler on CPU: off in dev, between HPA_MIN_REPLICAS and
# HPA_MAX_REPLICAS in the others. Every replica answers rate limit checks from
# the configuration the operator writes and counts in the shared store, so
# scaling out, by REPLICAS or by the autoscaler, needs no other change.
# GOMEMLIMIT is derived from MEMORY_LIMIT, so it governs the Go heap and not
# only the cgroup ceiling.

# Passed as LOGGING_LEVEL_ROOT, in lower case: the platform logger resolves
# its root level from the logging.level.root property, and a LOG_LEVEL in the
# environment only applies before the configloader is initialized.
LOG_LEVEL: info

# ============== COUNTER STORE ============================
# Redis holds the counters, and that is what makes a limit a limit of the domain
# rather than of each replica: with N replicas counting in their own memory, a
# limit of 100 admits 100*N.
#
# The database is DBaaS's. The chart declares an InternalDatabase of type redis
# for the release and a DatabaseSecretClaim for it; dbaas-operator provisions
# the database through the DBaaS Redis adapter and writes its connection
# properties into the Secret <SERVICE_NAME>-redis, and every replica mounts that
# Secret. A replica does not start until the Secret exists. dbaas-operator
# needs a Role in the namespace that lets it write Secrets, and DBaaS needs its
# Redis adapter, installed with redis.conf maxmemory-policy: noeviction: the
# adapter sets every database's redis.conf from its own installation, and its
# default, allkeys-lru, evicts counters and management records.
redis:
  dbaas:
    # Render the InternalDatabase and the DatabaseSecretClaim. false leaves
    # both to someone else, who still has to produce the Secret
    # <SERVICE_NAME>-redis with the key connectionProperties.json in DBaaS's
    # format: a test cluster without DBaaS, as the e2e workflow's is.
    enabled: true

# The address of dbaas-aggregator, a platform parameter shared by every chart
# that talks to DBaaS. The chart reads the namespace out of its host and
# assigns its DBaaS objects to the dbaas-operator running there.
API_DBAAS_ADDRESS: http://dbaas-aggregator.dbaas:8080

# ============== METRICS ============================
# The Prometheus endpoint: decisions and their latencies, budget headroom,
# extraction health, and the applied generation per domain. Plain HTTP on port
# 8080, cluster-internal. The Service publishes it under the name metrics, and
# the operator reads /debug/applied on it to learn which generation each
# replica enforces.
metrics:
  # An admission counts as near-limit once the rule has consumed this share of
  # the capacity of its window: the burst of a GCRA window, the requests of a
  # fixed one. Quoted so YAML cannot reshape the number before the service
  # parses it.
  nearLimitRatio: "0.9"

# ============== RESPONSE HEADERS ============================
# The service answers every check that a counting rule matched with
# x-ratelimit-limit, x-ratelimit-remaining, and x-ratelimit-reset, and a
# refusal that waiting cures with retry-after. ietf adds the ratelimit-policy
# and ratelimit fields of draft-ietf-httpapi-ratelimit-headers-11, which carry
# the limit and the remaining under the name of the rule, <block>/<rule>, with
# the time until one more request is admitted. false leaves
# them out, for clients that misread the fields or that must not learn the
# rule names; the other four headers stay either way.
responseHeaders:
  ietf: true

# ============== MANAGEMENT API ============================
# The operator interface: read the enforced rules, inspect live counters, and
# reset them. Off by default, because turning it on opens a port that can lift a
# rate limit.
#
# Every call carries a Kubernetes ServiceAccount token as its bearer token,
# and the service verifies it: the signature against the cluster's keys, the
# issuer, the audience in m2m.audience, the expiry. A caller listed in callers
# holds the operator role and may call every endpoint; any other verified
# caller gets 403, and a token that does not verify gets 401. To verify, the
# pod mounts its own ServiceAccount token, which reads the cluster's OIDC
# discovery and nothing else: the ServiceAccount has no Role. authorizationPolicy
# keeps the port to the callers' workloads as well, so a token alone does not
# open it.
#
# The port is exposed on the component's own Service, ratelimit, not on a
# Service of its own. What limits who reaches the port is the
# AuthorizationPolicy, and that is enforced by ztunnel at the pod: a second
# Service would change nothing about who can reach the port, and would add a
# second name for the platform's HTTPRoute to get right. The gateway's route names port 8082 on
# the one Service, which is what backendRefs.port is for.
management:
  enabled: false

  # The ServiceAccounts that may call the API: <name> for one in NAMESPACE,
  # <namespace>/<name> for one in another namespace. Each holds the operator
  # role. The schema refuses an empty list while enabled is true. A caller
  # sends a token the API server issued for its ServiceAccount with the
  # audience below, which the platform's clients do with
  # KUBERNETES_M2M_ENABLED=true.
  callers: []

  # The audience a caller's token is issued for. A token for any other
  # audience is refused with 401.
  m2m:
    audience: netcracker

  # Restrict the port to the workloads that call it. The policy denies every
  # other source before a token is read, so a token leaked from a listed
  # caller does not open the port to another workload. Turn it off only where
  # something outside the mesh does the same job, and say so in a review.
  authorizationPolicy:
    enabled: true

    # Service accounts allowed to reach the port, in NAMESPACE. Empty means
    # the entries of callers, each in its own namespace. Set it when the
    # callers come through a gateway: the policy then sees the gateway's
    # workload, not the caller's. Istio's automated deployment names a
    # Gateway API gateway's generated ServiceAccount after the gateway and its
    # class, <gateway>-istio. Check it before listing it:
    #
    #   kubectl get pod -l gateway.networking.k8s.io/gateway-name=<gateway> \
    #     -o jsonpath='{.items[0].spec.serviceAccountName}'
    allowedServiceAccounts: []

  # The rate limit domains of the gateways that route to the management API.
  # A request under /ratelimit/v1 through such a gateway is not rate limited:
  # the service admits its check without reading the rules or the counter
  # store, and counts it in ratelimit_checks_total as verdict="exempt". The
  # API therefore stays reachable through a gateway that fails closed while
  # the counter store is down, and a policy of these domains has no effect on
  # the API's paths. The same path in any other domain is checked as usual.
  #
  # Each entry has to equal gateways.<role>.domain of this chart for that
  # gateway. Nothing validates the match, and an entry that is no
  # gateway's domain exempts nothing. Change the list when the private
  # gateway's domain is not the default, or when another gateway from
  # authorizationPolicy.allowedServiceAccounts routes to the API. An empty
  # list rate limits the API's requests like any others. A caller that
  # reaches the port directly needs no entry.
  gatewayDomains: [gateway.private]

# ============== GATEWAY FILTER ============================
# The install-wide defaults of the rate limit filter on each gateway; each
# gateway may override any of them under gateways.<role>. The port the filters
# send checks to is the contract's 9000 and is not a value: a satellite
# computes the baseline's address from the constant alone.
filter:
  timeout: 0.05s
  # What an unavailable limiter means for the traffic of a gateway: the
  # service unreachable or timing out, and the service answering UNAVAILABLE
  # because its counter store failed. It is a gateway decision rather than a
  # service one, which is why it renders on the filter: false keeps the traffic
  # flowing unlimited, true rejects it with a 503. A public gateway usually prefers flowing, a private one may prefer
  # rejecting; that is what the per-gateway override is for.
  failClosed: false
  # Status the client sees on a refused request. Envoy ignores values below
  # 400, and 429 is what retry-aware clients expect.
  rateLimitedStatus: 429
  # true answers gRPC callers behind the gateway with RESOURCE_EXHAUSTED
  # instead of UNAVAILABLE, which is the retryable code gRPC clients back off
  # on.
  grpcAsResourceExhausted: false
  # The service supplies x-ratelimit-limit, x-ratelimit-remaining,
  # x-ratelimit-reset, retry-after, and the ratelimit-policy and ratelimit
  # fields of draft-ietf-httpapi-ratelimit-headers-11 itself, as ready
  # response headers. DRAFT_VERSION_03 would additionally let Envoy render
  # X-RateLimit-* from per-descriptor statuses, which the service does not
  # populate, so OFF is the honest default: the flag changes nothing today,
  # and the headers keep coming from the one place that computes them.
  xRateLimitHeaders: "OFF"

# Gateway-side switches of the filter itself: the share of requests the filter
# checks at all, and the share it enforces on. Both are emergency controls,
# independent of behavior: Shadow in the rules. Dropping enforcedPercent to 0
# turns every limit into a dry run without touching a single policy, and
# enabledPercent: 0 takes the filter out of the request path entirely. Wired
# as Envoy runtime fractions (ratelimit.<gateway>.enabled / .enforced), so a
# runtime override can flip them without a redeploy.
runtime:
  enabledPercent: 100
  enforcedPercent: 100

# ============== MONITORING DELIVERY ============================
# The scrape target, the alert rules, and the Grafana dashboard, delivered as
# custom resources: a PodMonitor and a PrometheusRule for the platform's
# Prometheus and a GrafanaDashboard for grafana-operator v4. The platform
# sets this parameter; off by default because all three need their
# operators' CRDs, and installing them into a cluster without monitoring
# fails the release.
MONITORING_ENABLED: false

# The alert rules of the data plane, one PrometheusRule scoped to the release
# namespace. Every rule reads the service's own series; the operator chart
# ships the rules over the policy status. The thresholds below are the ones an
# installation may need to move; the expressions stay in the template.
alerts:
  enabled: true

  # RatelimitDecisionLatencyHigh: the p99 of a whole check, in seconds, above
  # which the alert fires. The decision budget is 10 ms: the gateway's filter
  # timeout sits above it, and a p99 past the budget is the store, the token
  # cache, or the node saturating, before the timeout turns checks into the
  # gateway's failure mode. Held for latencyFor so a burst does not page.
  latencyBudgetSeconds: 0.01
  latencyFor: 10m

  # RatelimitUnknownDomain: checks for a domain no policy claims pass
  # unlimited, so the alert fires on any increase over the window, held for
  # unknownDomainFor. A typo in a filter's domain or a deleted policy is
  # steady traffic, not a spike; one stray check is not.
  unknownDomainFor: 5m

  # RatelimitStoreErrors: a failed counter store decision is a check the
  # gateway's failure mode decided, whichever way it is set. Any increase over
  # the 5m window fires. The hold is the window's own length, so a single
  # error ages out of the window before the hold ends and one retried timeout
  # never pages; a shorter hold would fire inside the window the lone error
  # still fills. Lower it only where every store error must page at once.
  storeErrorsFor: 5m

  # RatelimitKeyDeclaredNotExtracted: a declared identity key whose
  # extraction series stays at zero while the domain's own requests carry
  # tokens is a claim path the tokens do not carry, and every client of that
  # rule shares one bucket. Both halves are per domain, so an idle domain has
  # no tokens to be judged against and never pages on another's traffic. The
  # window is long because the series are rates of low-volume counters.
  keyNotExtractedWindow: 15m
  keyNotExtractedFor: 30m

  # RatelimitDomainBudgetNearLimit: the worst-case buckets one decision can
  # collect across a domain, against the budget of 128 the compiler enforces.
  # Past the budget an edit stops compiling and the domain stays on its
  # last-good generation; the warning fires at this many so the author has
  # room left when it does. 104 is 80 percent of the budget.
  domainBudgetWarnAt: 104

  # RatelimitConfigurationAbsent: a replica's mounted directory holds no
  # manifest, so the operator's ConfigMap is gone: uninstalled, pruned, or not
  # yet written. The replica keeps what it applied and no policy change
  # reaches it. Held for configAbsentFor, past the kubelet's projection of a
  # recreated ConfigMap.
  configAbsentFor: 5m

# The Gateway objects the filters target, by name. They must match the
# parameters of qubership-core-mesh-config, which creates the Gateways. The
# private gateway's identity is also what the management AuthorizationPolicy
# allows by default.
ISTIO_PUBLIC_GATEWAY_NAME: public-gateway
ISTIO_PRIVATE_GATEWAY_NAME: private-gateway

# ============== COMPOSITE ============================
# The platform's composite variables, the same ones core-operator renders by.
# BASELINE_ORIGIN empty is a standalone installation or the baseline of a
# composite: the whole chart renders. BASELINE_ORIGIN set is a satellite: only
# the gateway filters render, and they send checks to the baseline's Service at
# ratelimit.<baseline namespace>:9000, which is why that Service has a fixed
# name. The platform installs the same pair of charts in every namespace, and
# rendering no service there is what keeps a satellite from waiting NotReady
# for an operator that never comes. BASELINE_CONTROLLER is read for parity with
# control-plane, which resolves the baseline the same way; on this platform the
# baseline is never blue-green'd, so the platform leaves it empty.
BASELINE_ORIGIN: ""
BASELINE_CONTROLLER: ""

# What this chart owns per gateway: whether to rate limit it, and under which
# domain. The domain is the binding key: it must equal spec.domain of the
# RateLimitPolicy that carries this gateway's rules. Nothing validates the
# match; a typo shows up only as an "unknown rate limit domain" line in the
# service log.
#
# namespace is optional and defaults to NAMESPACE. timeout,
# failClosed, rateLimitedStatus and grpcAsResourceExhausted may be set here to
# override the filter.* defaults for one gateway; the usual case is a private
# gateway that fails closed while the public one keeps flowing.
gateways:
  public:
    enabled: true
    domain: gateway.public
  private:
    enabled: true
    domain: gateway.private

# ============== KUBERNETES ============================
# The node label the pods spread over: one topology spread constraint,
# maxSkew 1, whenUnsatisfiable ScheduleAnyway, selecting this Deployment's
# own pods. CLOUD_TOPOLOGIES, the platform parameter, replaces it with one
# constraint per entry; an entry sets topologyKey and may set maxSkew and
# whenUnsatisfiable.
CLOUD_TOPOLOGY_KEY: kubernetes.io/hostname
