# ============== PLATFORM ============================
# The parameters the platform sets on every one of its services, read the way
# its other services read them. The defaults are for an installation without
# them, except NAMESPACE and TAG, which every installation sets.
#
# The name of the Deployment, the ServiceAccount and the RBAC pair, and the
# app.kubernetes.io/name and name labels. The service chart's Service keeps
# its fixed name, ratelimit, whatever this is.
SERVICE_NAME: ratelimit-operator
# The namespace every object lands in. Required, with no default: the platform
# sets it to the namespace it installs into, and a manual helm install sets it
# to the namespace it passes as -n.
NAMESPACE: ""
# The image. TAG is required, with no default. A floating tag such as "latest"
# moves under a running workload, so two pods of one rollout can end up on
# different builds.
IMAGE_REPOSITORY: ghcr.io/netcracker/qubership-ratelimit-operator
TAG: ""
# Labels: app.kubernetes.io/part-of, app.kubernetes.io/managed-by,
# app.kubernetes.io/version (empty renders an empty label), and
# deployment.netcracker.com/sessionId (empty is unimplemented).
APPLICATION_NAME: ratelimit
MANAGED_BY: Helm
ARTIFACT_DESCRIPTOR_VERSION: ""
DEPLOYMENT_SESSION_ID: ""
# On KUBERNETES the container runs as group 10001, and its root filesystem is
# read-only while READONLY_CONTAINER_FILE_SYSTEM_ENABLED is true; on OPENSHIFT
# the platform assigns the user and the group, and the root filesystem is
# writable.
PAAS_PLATFORM: KUBERNETES
READONLY_CONTAINER_FILE_SYSTEM_ENABLED: true
# The rollout, DEPLOYMENT_STRATEGY_TYPE, is not set here. Unset and
# ramped_slow_rollout replace one pod at a time and keep the old one until the
# new one is Ready; recreate and best_effort_controlled_rollout stop the old
# pods first, and custom_rollout takes DEPLOYMENT_STRATEGY_MAXSURGE and
# DEPLOYMENT_STRATEGY_MAXUNAVAILABLE, 25% each by default.
#
# The delay before the first liveness probe.
LIVENESS_PROBE_INITIAL_DELAY_SECONDS: 15

# ============== OPERATOR ============================
# REPLICAS, CPU_REQUEST, MEMORY_REQUEST, CPU_LIMIT and MEMORY_LIMIT are set by
# the resource profile, not here: one source of truth, so the defaults cannot
# drift away from the profiles. values.schema.json requires them, so installing
# without `-f resource-profiles/<profile>.yaml` fails with a clear message
# instead of rendering a Deployment with empty resources.
#
# REPLICAS is 2 in dev-ha and prod, 1 in the others. Only the pod that holds
# the Lease writes the policy status and the configuration ConfigMap; the
# second replica adds no capacity, only a standby that takes the Lease over
# when the holder goes, without waiting for a new pod to schedule and start.
# GOMEMLIMIT is derived from MEMORY_LIMIT, so it governs the Go heap and not
# only the cgroup ceiling.

# Passed as LOGGING_LEVEL_ROOT, in lower case: the platform logger resolves
# its root level from the logging.level.root property, and a LOG_LEVEL in the
# environment only applies before the configloader is initialized.
LOG_LEVEL: info

# ============== MONITORING DELIVERY ============================
# The scrape target and the alert rules of the operator, delivered as a
# PodMonitor and a PrometheusRule for the platform's Prometheus. The platform
# sets this parameter; off by default because both need the
# monitoring operator's CRDs, and installing them into a cluster without
# monitoring fails the release.
MONITORING_ENABLED: false

# The alert rules over the policy status, one PrometheusRule scoped to
# NAMESPACE. Every rule reads the operator's own series, the ones the
# pod holding the Lease publishes; the service chart ships the rules over the
# data plane. The durations below are the ones an installation may need to
# move; the expressions stay in the template. The block is policyAlerts rather
# than alerts because the platform passes one parameter set to both charts,
# the service chart's alerts block holds other keys, and each schema refuses a
# key its block does not declare.
policyAlerts:
  enabled: true

  # RatelimitStalled: the operator judged a domain stuck rather than
  # progressing, with the reason in the label: a replica behind past the
  # propagation deadline, a manifest format a replica does not read, or a
  # generation that does not fit the ConfigMap. Held for stalledFor, above
  # the deadline itself, so a rollout that lands late does not page.
  stalledFor: 5m

  # RatelimitNotReadyLong: the latest generation of a policy is not the one
  # enforced. Reconciling and Propagating are normal for the kubelet's sync
  # period; held for notReadyFor, an edit stuck on last-good or a rollout
  # that never completes is what fires.
  notReadyFor: 30m

  # RatelimitRuleProblems: the latest generation has a blocking problem and
  # is not enforced; last-good runs instead. Held for ruleProblemsFor so an
  # author fixing a typo within minutes does not page.
  ruleProblemsFor: 5m

  # RatelimitNoReplicas: no ready service replica, so every check of the
  # domain is decided by the gateway's failure mode, unlimited under
  # fail-open. Held for noReplicasFor, long enough for a rollout's surge pod
  # to become ready, and far shorter than notReadyFor, which also fires then.
  noReplicasFor: 5m

  # RatelimitChecksStopped: ready replicas enforce a domain, and no check of
  # it has arrived over checksStoppedWindow: the gateway's filter is off or
  # gone, its domain does not match, or the path to the Service is broken,
  # and the traffic passes unlimited with every status Ready. A domain whose
  # gateway carries no traffic fires too, so raise the window for a domain
  # that is idle for long stretches.
  checksStoppedWindow: 10m
  checksStoppedFor: 15m

  # RatelimitConfigWriteErrors: the operator could not save the namespace's
  # configuration. The replicas keep the previous one and the last-good
  # fallback a restart would need is not being saved; any increase over the
  # window fires.
  configWriteErrorsWindow: 15m

  # RatelimitNoOperatorLeader: no operator pod holds the Lease, so nothing
  # compiles policies or writes the ConfigMap; the replicas keep enforcing
  # what they have. Held for noLeaderFor, past the Lease's own handover.
  noLeaderFor: 5m

# ============== COMPOSITE ============================
# The platform's composite variable, the same one core-operator and the service
# chart render by. Empty is a standalone installation or the baseline of a
# composite: the whole chart renders. Set is a satellite: this chart renders
# nothing, because a satellite runs no operator and its gateway filters come
# from the service chart.
BASELINE_ORIGIN: ""

# ============== KUBERNETES ============================
# The node label the pods spread over: one topology spread constraint,
# maxSkew 1, whenUnsatisfiable ScheduleAnyway, selecting this Deployment's
# own pods. CLOUD_TOPOLOGIES, the platform parameter, replaces it with one
# constraint per entry; an entry sets topologyKey and may set maxSkew and
# whenUnsatisfiable.
CLOUD_TOPOLOGY_KEY: kubernetes.io/hostname
