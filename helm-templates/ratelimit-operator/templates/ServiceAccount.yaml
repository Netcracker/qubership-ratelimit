{{- if ne (include "ratelimit.mode" .) "satellite" }}
{{- if .Values.serviceAccount.create }}
# The only ServiceAccount of the delivery that a Role is bound to: the
# service pod mounts no token at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ratelimit.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratelimit.labels" . | nindent 4 }}
{{- end }}
{{- end }}
