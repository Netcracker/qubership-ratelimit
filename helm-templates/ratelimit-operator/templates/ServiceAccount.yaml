{{- if ne (include "ratelimit.mode" .) "satellite" }}
{{- if .Values.serviceAccount.create }}
# The only ServiceAccount of the delivery that a Role is bound to: the
# service pod mounts no token at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ .Values.serviceAccount.name | default .Values.SERVICE_NAME }}'
  namespace: '{{ .Values.NAMESPACE | default .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID | default "unimplemented" }}'
{{- end }}
{{- end }}
