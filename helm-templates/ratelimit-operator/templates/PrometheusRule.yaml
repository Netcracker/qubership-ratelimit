{{- /*
The alert rules over the policy status. Every expression is scoped to
NAMESPACE by the label the scrape adds, and every rule reads a series
the operator pod holding the Lease publishes: the data plane's series and
their rules are the service chart's. RatelimitChecksStopped also reads the
service's checks, because only the operator's series say which domains a
policy claims. The hold durations come from
.Values.policyAlerts, where each one carries its rationale; the shape of each
expression is fixed here.

A label written as {{ "{{" }} $labels.x {{ "}}" }} is Prometheus's template
syntax passed through Helm's.
*/ -}}
{{- if ne (include "ratelimit.mode" .) "satellite" }}
{{- if and .Values.MONITORING_ENABLED .Values.policyAlerts.enabled }}
{{- $ns := .Values.NAMESPACE }}
{{- $sel := printf "namespace=%q" $ns }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: '{{ .Values.SERVICE_NAME }}-alerts'
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/processed-by-operator: victoriametrics-operator
spec:
  groups:
    - name: ratelimit-operator
      rules:
        - alert: RatelimitStalled
          expr: max by (namespace, domain, reason) (ratelimit_policy_stalled{ {{- $sel -}} }) == 1
          for: {{ .Values.policyAlerts.stalledFor }}
          labels:
            severity: critical
          annotations:
            summary: A domain is stuck rather than progressing
            description: >-
              The operator judges domain {{ "{{" }} $labels.domain {{ "}}" }} in
              {{ "{{" }} $labels.namespace {{ "}}" }} stalled with reason {{ "{{" }} $labels.reason {{ "}}" }}:
              ReplicaStale is a replica behind past the propagation deadline, ReplicaFormatUnsupported a
              replica that does not read the manifest's format, ConfigMapTooLarge a generation that does not
              fit the ConfigMap. The policy's Ready condition names the replicas.

        - alert: RatelimitNotReadyLong
          expr: min by (namespace, domain) (ratelimit_policy_ready{ {{- $sel -}} }) == 0
          for: {{ .Values.policyAlerts.notReadyFor }}
          labels:
            severity: warning
          annotations:
            summary: The latest generation of a policy has not been enforced for long
            description: >-
              Domain {{ "{{" }} $labels.domain {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} has not
              had its latest generation enforced for {{ .Values.policyAlerts.notReadyFor }}. Reconciling and
              Propagating pass within the kubelet's sync period; what stays is an edit held on last-good,
              a fleet that cannot be probed, or a rollout that never completes. The reason is on the
              policy's Ready condition and on the ratelimit_policy_ready series.

        - alert: RatelimitNoReplicas
          # The verdict, not the count: a fleet the operator never observed
          # also counts 0 replicas, and its reason is ProbeFailed.
          expr: max by (namespace, domain) (ratelimit_policy_ready{ {{- $sel -}} , reason="NoReplicas"}) == 0
          for: {{ .Values.policyAlerts.noReplicasFor }}
          labels:
            severity: critical
          annotations:
            summary: No ready rate limit service replica; the domain is not limited
            description: >-
              Domain {{ "{{" }} $labels.domain {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} has no ready
              service replica, so every check of it is decided by the gateway's failure mode: unlimited under
              fail-open, refused under fail-closed. Read the ratelimit-service Deployment and its pods.

        - alert: RatelimitChecksStopped
          expr: >-
            max by (namespace, domain) (ratelimit_policy_replicas{ {{- $sel -}} , state="applied"}) > 0
            unless on (namespace, domain)
            sum by (namespace, domain) (rate(ratelimit_checks_total{ {{- $sel -}} }[{{ .Values.policyAlerts.checksStoppedWindow }}])) > 0
          for: {{ .Values.policyAlerts.checksStoppedFor }}
          labels:
            severity: warning
          annotations:
            summary: Service replicas enforce a policy, but no checks reach them
            description: >-
              Domain {{ "{{" }} $labels.domain {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} is enforced by
              ready replicas, but no check has reached them for {{ .Values.policyAlerts.checksStoppedWindow }}: the
              gateway's traffic passes unlimited. The gateway filter is off (the ratelimit.<gateway>.enabled
              runtime key), removed, or its domain does not match; or the path to the Service is broken. A
              domain whose gateway carries no traffic at all fires as well.

        - alert: RatelimitRuleProblems
          expr: max by (namespace, domain) (ratelimit_policy_rule_problems{ {{- $sel -}} , severity="blocking"}) > 0
          for: {{ .Values.policyAlerts.ruleProblemsFor }}
          labels:
            severity: warning
          annotations:
            summary: The latest generation of a policy has a blocking problem
            description: >-
              The latest generation of domain {{ "{{" }} $labels.domain {{ "}}" }} in
              {{ "{{" }} $labels.namespace {{ "}}" }} carries {{ "{{" }} $value | printf "%.0f" {{ "}}" }} blocking
              problems and is not enforced; the previous generation keeps running. The problems are listed
              in the policy's status.

        - alert: RatelimitConfigWriteErrors
          expr: sum by (namespace, reason) (increase(ratelimit_config_write_errors_total{ {{- $sel -}} }[{{ .Values.policyAlerts.configWriteErrorsWindow }}])) > 0
          labels:
            severity: critical
          annotations:
            summary: The operator cannot save the namespace's configuration
            description: >-
              The operator in {{ "{{" }} $labels.namespace {{ "}}" }} failed
              {{ "{{" }} $value | printf "%.0f" {{ "}}" }} writes of the ratelimit-config ConfigMap in
              {{ .Values.policyAlerts.configWriteErrorsWindow }} with reason {{ "{{" }} $labels.reason {{ "}}" }}.
              The replicas keep the previous configuration and the last-good fallback a restart would need
              is not being saved. size is a state the object cannot hold, api an answer of the API server,
              other the rest; the operator log has the error.

        - alert: RatelimitNoOperatorLeader
          expr: absent(ratelimit_leader{ {{- $sel -}} } == 1)
          for: {{ .Values.policyAlerts.noLeaderFor }}
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            summary: No operator pod holds the Lease
            description: >-
              No ratelimit operator pod in {{ $ns }} reports holding the Lease, so no policy is compiled,
              no status is written, and the ConfigMap is not maintained; the service replicas keep enforcing
              what they applied last. Check the operator Deployment and its scrape.
{{- end }}
{{- end }}
