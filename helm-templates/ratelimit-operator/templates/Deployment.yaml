{{- if ne (include "ratelimit.mode" .) "satellite" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Values.SERVICE_NAME }}'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/instance: '{{ cat .Values.SERVICE_NAME "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
    app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    app.kubernetes.io/component: 'operator'
    app.kubernetes.io/technology: 'go'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID | default "unimplemented" }}'
spec:
  # REPLICAS from the resource profile: 2 in dev-ha and prod, 1 in the
  # others. Only the pod that holds the Lease reconciles, writes the policy
  # status and the configuration ConfigMap, and publishes the policy series;
  # the other replica is a standby that takes the Lease over when the holder
  # goes. The Lease also keeps one writer while two pods overlap during a
  # rollout. The overlap is deliberate: the new pod takes the lease when the
  # old one lets go, and the service reads a ConfigMap that is there
  # throughout.
  replicas: {{ .Values.REPLICAS | default 1 }}
  selector:
    matchLabels:
      name: '{{ .Values.SERVICE_NAME }}'
  strategy:
    {{- if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "recreate" }}
    type: Recreate
    {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "best_effort_controlled_rollout" }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 80%
    {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "custom_rollout" }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.DEPLOYMENT_STRATEGY_MAXSURGE | default "25%" }}
      maxUnavailable: {{ .Values.DEPLOYMENT_STRATEGY_MAXUNAVAILABLE | default "25%" }}
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  template:
    metadata:
      labels:
        app: '{{ .Values.SERVICE_NAME }}'
        name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/instance: '{{ cat .Values.SERVICE_NAME "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
        app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
        app.kubernetes.io/component: 'operator'
        app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
        app.kubernetes.io/technology: 'go'
    spec:
      serviceAccountName: '{{ .Values.serviceAccount.name | default .Values.SERVICE_NAME }}'
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: '{{ .Values.IMAGE_REPOSITORY }}:{{ .Values.TAG }}'
          imagePullPolicy: IfNotPresent
          # The base image's entrypoint runs its arguments as the command, so
          # the binary is the first argument.
          command:
            - /usr/bin/entrypoint.sh
          args:
            - /app/ratelimit-operator
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            # The operator's own Deployment, which owns the configuration
            # ConfigMap so that the object goes with the operator and never
            # with a policy.
            - '--deployment={{ .Values.SERVICE_NAME }}'
          env:
            # The name this replica signs the leader election lease with.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOGGING_LEVEL_ROOT
              value: '{{ lower .Values.LOG_LEVEL }}'
            # The namespace this installation serves. It is what keeps the
            # operator's RBAC a Role: unset is a startup error, not a fallback
            # to watching the whole cluster.
            - name: CLOUD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Stamped into the manifest of the configuration ConfigMap as
            # operatorVersion: the image tag, which is the release. The
            # pipeline passes no build arguments to the image, so without this
            # every manifest would say "dev".
            - name: OPERATOR_VERSION
              value: '{{ .Values.TAG }}'
          ports:
            - name: probes
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: {{ .Values.LIVENESS_PROBE_INITIAL_DELAY_SECONDS }}
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            {{- if eq .Values.PAAS_PLATFORM "KUBERNETES" }}
            runAsGroup: 10001
            {{- end }}
            readOnlyRootFilesystem: {{ and .Values.READONLY_CONTAINER_FILE_SYSTEM_ENABLED (eq .Values.PAAS_PLATFORM "KUBERNETES") }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: '{{ .Values.CPU_REQUEST }}'
              memory: '{{ .Values.MEMORY_REQUEST }}'
              # Bounded here rather than in a resource profile: the process
              # writes no files, so its ephemeral storage is the container log
              # and nothing else, and that does not vary by install size.
              ephemeral-storage: 64Mi
            limits:
              cpu: '{{ .Values.CPU_LIMIT }}'
              memory: '{{ .Values.MEMORY_LIMIT }}'
              ephemeral-storage: 256Mi
      topologySpreadConstraints:
        {{- if .Values.CLOUD_TOPOLOGIES }}
        {{- range $v := .Values.CLOUD_TOPOLOGIES }}
        - topologyKey: '{{ $v.topologyKey }}'
          maxSkew: {{ $v.maxSkew | default 1 }}
          whenUnsatisfiable: {{ $v.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              name: '{{ $.Values.SERVICE_NAME }}'
        {{- end }}
        {{- else }}
        - topologyKey: '{{ .Values.CLOUD_TOPOLOGY_KEY }}'
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              name: '{{ .Values.SERVICE_NAME }}'
        {{- end }}
      # Long enough for the manager to hand the lease over on SIGTERM before
      # the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 30
{{- end }}
