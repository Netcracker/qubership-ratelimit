{{- if ne (include "ratelimit.mode" .) "satellite" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ratelimit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratelimit.labels" . | nindent 4 }}
spec:
  # One replica, and no REPLICAS value: the operator writes the policy status
  # and the configuration ConfigMap, and the Lease keeps one writer while two
  # pods overlap during a rollout. The overlap is deliberate: the new pod
  # takes the lease when the old one lets go, and the service reads a
  # ConfigMap that is there throughout.
  replicas: 1
  selector:
    matchLabels:
      {{- include "ratelimit.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ratelimit.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ratelimit.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The base image's entrypoint runs its arguments as the command, so
          # the binary is the first argument.
          command:
            - /usr/bin/entrypoint.sh
          args:
            - /app/ratelimit-operator
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            # The operator's own Deployment, which owns the configuration
            # ConfigMap so that the object goes with the operator and never
            # with a policy.
            - --deployment={{ include "ratelimit.fullname" . }}
          env:
            # The name this replica signs the leader election lease with.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOGGING_LEVEL_ROOT
              value: '{{ lower .Values.logLevel }}'
            # The namespace this installation serves. It is what keeps the
            # operator's RBAC a Role: unset is a startup error, not a fallback
            # to watching the whole cluster.
            - name: CLOUD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Stamped into the manifest of the configuration ConfigMap as
            # operatorVersion: the image tag, which is the release. The
            # pipeline passes no build arguments to the image, so without this
            # every manifest would say "dev".
            - name: OPERATOR_VERSION
              value: '{{ .Values.image.tag | default .Chart.AppVersion }}'
          ports:
            - name: probes
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: '{{ .Values.CPU_REQUEST }}'
              memory: '{{ .Values.MEMORY_REQUEST }}'
              # Bounded here rather than in a resource profile: the process
              # writes no files, so its ephemeral storage is the container log
              # and nothing else, and that does not vary by install size.
              ephemeral-storage: 64Mi
            limits:
              cpu: '{{ .Values.CPU_LIMIT }}'
              memory: '{{ .Values.MEMORY_LIMIT }}'
              ephemeral-storage: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough for the manager to hand the lease over on SIGTERM before
      # the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 30
{{- end }}
