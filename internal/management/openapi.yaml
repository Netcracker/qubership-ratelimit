openapi: 3.0.3
info:
  title: Rate Limit Management API
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    Control interface of the rate limit service: read what is enforced,
    inspect and reset live counters, simulate a request, and tap the decision
    audit stream.

    Principles:
    * The API mutates runtime state only (counters, audit taps). Configuration
      (limits, rules, mappings) lives in the RateLimitPolicy and
      RateLimitMapping custom resources - the GitOps path. There are no
      configuration write endpoints.
    * Reads never charge counters: every read goes through the store's Peek,
      evaluated at cost=1. Judging arbitrary costs is what the simulation
      endpoint is for.
    * Every mutation is audited - a structured audit log line with the
      request id and subject is the durable journal; a Kubernetes Event is
      emitted as an operational signal on top, never as the record.
    * Destructive radius is bounded by construction: DELETE only addresses
      one rule; anything wider goes through the counter-resets action, whose execution step only exists with the single-use confirmation token minted by a mandatory preview - look before you delete is enforced by construction, and the sweep's work is bounded server-side: the walk has a deadline, and a domain runs at most one sweep at a time.
    * The base path is a security boundary: the gateway's auth extension authenticates every call against the platform identity provider, and the service itself authorizes it by the roles the token carries, per path and verb.

    Dynamic axis parameters: counters are addressed by named identity axes
    (client, captured path segments). Query parameters of the form
    `axis.<name>=<value>` select by them: repeating one name ORs its values,
    different names AND together, and a counter whose rule lacks a named
    axis never matches. OpenAPI cannot declare wildcard parameter names, so each endpoint carries a stand-in entry marked x-dynamic-parameter: true - exclude those from generated clients and send the family as raw query pairs; the stand-ins document the contract and are shown in examples. Bulk selections
    travel as a JSON body in the counter-resets action instead - a URL is
    the wrong place for a thousand client ids.

    Errors: every non-2xx the SERVICE forms is NC.TMFErrorResponse.v1.0 (see the TmfErrorResponse schema); clients branch on `code`, never on prose. The perimeter answers before the service on an invalid or expired token, in its own format - never parse an arbitrary 401 as TMF, and do not expect X-Request-Id on one.
    Catalog:
    * RLS-0400 - invalid request (query, body, cursor, header patterns)
    * RLS-0401 - authentication required
    * RLS-0403 - access denied
    * RLS-0404 - unknown resource (domain, rule, window)
    * RLS-0409 - conflict; meta.conflictType names the recovery (stale If-Match; same Idempotency-Key with a different canonical command; a confirmation token whose selection,
      domain, subject, or rule-set version no longer matches; an expectedRuleSetVersion that no longer matches)
    * RLS-0410 - confirmation token expired or already used
    * RLS-0422 - selection exceeds the synchronous work limit (a failure
      after acceptance: recorded, replayed, partial disclosure attached)
    * RLS-0501 - command interrupted after acceptance: any unforeseen error
      that cut the sweep - recorded by the walker itself, or finalized by a
      retry once the lease expired; replays with mandatory partial disclosure
    * RLS-0500 - internal error
    * RLS-0503 - counter store unavailable

    Traceability: every response the service forms carries the X-Request-Id header - a caller-supplied value round-trips, an absent one is generated - and the same id runs through the operator log, the audit journal, and the meta.requestId of every error body. Quote it when asking what happened.
servers:
- url: /ratelimit/v1
security:
- bearerAuth: []
tags:
- name: domains
  description: The enforced rule set, as the decision path reads it.
- name: counters
  description: Live counter state - inspection and resets.
- name: simulations
  description: Non-charging request debugger.
- name: meta
  description: Service self-description.
paths:
  /domains:
    get:
      tags:
      - domains
      operationId: listDomains
      summary: List the domains under management
      responses:
        '200':
          description: Every domain the current rule set carries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainList'
              example:
                items:
                - domain: gateway.public
                  ruleSetVersion: 7c31a9f4e0d2
                  policies: 2
                  blocks: 8
                  rules: 15
                  effectiveKeys:
                  - client
                  - plan
                  - roles
                  - tenant
                  listValuedKeys:
                  - roles
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: 'The entry point of an investigation: which domains the enforced
        rule set carries and how big each one is. Domains are few by design, so
        the listing is not paginated.'
      parameters:
      - $ref: '#/components/parameters/xRequestId'
  /domains/{domain}/rules:
    get:
      tags:
      - domains
      operationId: getRules
      summary: The enforced rule set of one domain
      description: |-
        Reports what is actually enforced - which can be an earlier last-good
        generation of a policy, not the latest object in the cluster. The `axes`
        list of each rule is the DELETE contract: the direct form requires one
        value for every declared axis.

        With `path` (and optionally `method`) the view is filtered to the
        blocks whose targets match that request - the engine's own route
        matcher, not a naive prefix compare, so segment-based Prefix and
        Template captures behave exactly as they do on traffic. This is the
        static answer to "which rules guard this API"; feed the resulting
        rule ids into the counters listing with `limited=true` to see which
        of them hold refusals right now.

        The response names the ruleSetVersion of the snapshot it renders; the addressed DELETE accepts it as expectedRuleSetVersion to refuse acting on a set the operator has not seen.

        Scoped by axis.<name> (e.g. ?axis.client=alice), the same view turns into an applicability analysis: every rule is annotated always (applies for every completion of the unknown identity), conditional (for some - conditionalOn names the gates), or never. Supplying more axes sharpens the answer monotonically: a gate closed by a new value moves rules between the classes and never reopens.
      parameters:
      - $ref: '#/components/parameters/domain'
      - name: path
        in: query
        required: false
        description: Filter to blocks whose targets match this request path.
        schema:
          type: string
        example: /api/orders
      - name: method
        in: query
        required: false
        description: HTTP method for the route match; meaningful only with path
          - method without path is refused (RLS-0400), not silently ignored.
        schema:
          type: string
        example: GET
      - name: axis.<name>
        in: query
        required: false
        description: 'Documentation stand-in for the dynamic axis parameters (OpenAPI
          cannot declare wildcard names). Scopes the view to a partial identity:
          each supplied key is fixed by what one caller carries: a scalar key takes
          ONE value, and repeating it is refused (RLS-0400), unlike the listing''s
          OR; a list-valued key (see listValuedKeys) IS repeatable, and the supplied
          values form its COMPLETE set - Contains and Exists decide against it,
          e.g. ?axis.client=alice&axis.roles=support&axis.roles=operator. Unnamed
          keys stay unknown. Every rule then carries applicability and, when conditional,
          conditionalOn. Valid names are the domain''s effectiveKeys and the blocks''
          captures; an unknown name is refused (RLS-0400), never ignored. Orthogonal
          to path/method, which filter blocks rather than annotate rules.'
        schema:
          type: string
        example: alice
        x-dynamic-parameter: true
      - name: absent
        in: query
        required: false
        style: form
        explode: true
        description: 'Declares identity keys KNOWN ABSENT: the key''s value set
          is empty - for a list-valued key that is the same statement as an empty
          list, which is exactly how the engine reads Exists (set non-empty) and
          NotExists (set empty). Repeatable. An absent key decides conditions -
          NotExists satisfied, Exists failed - and voids rules that count by it:
          their axis can never take a value, so applicability is never. A key both
          supplied via axis.<name> and declared absent is a contradiction (RLS-0400);
          an unknown name is refused likewise. absent alone forms an identity scope:
          the applicability annotations appear even when no axis.<name> is supplied.'
        schema:
          type: array
          items:
            type: string
        example:
        - tenant
      - $ref: '#/components/parameters/xRequestId'
      responses:
        '200':
          description: The compiled rule set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetView'
              examples:
                full:
                  summary: 'Unscoped: the enforced set as compiled'
                  value:
                    domain: gateway.public
                    ruleSetVersion: 7c31a9f4e0d2
                    effectiveKeys:
                    - client
                    - plan
                    - roles
                    - tenant
                    listValuedKeys:
                    - roles
                    blocks:
                    - policy: quote-api
                      block: cascade
                      mode: FirstMatch
                      routes:
                      - type: Prefix
                        value: /api/quotes/
                        methods:
                        - GET
                        - POST
                      rules:
                      - id: quote-api/cascade/internal
                        policy: quote-api
                        block: cascade
                        rule: internal
                        mode: bypass
                        axes: []
                        when:
                        - key: client
                          operator: Equals
                          value: prometheus
                        rates: []
