sonar.sources=.
sonar.tests=.
sonar.exclusions=**_test.go,bin/**
sonar.test.inclusions=**_test.go

# Generated or scaffolded code, and code a unit test cannot reach:
#   zz_generated.deepcopy.go  written by controller-gen
#   api/v1alpha1              type declarations and markers, no logic
#   cmd                       wiring; exercised by tests/e2e, not by go test
#   tests/e2e                 shell suite, not Go
#   engine/store/storetest    conformance suite: its uncovered lines are the
#                             assertion-failure branches, which execute only
#                             against a broken store implementation
sonar.coverage.exclusions=**/zz_generated.*.go,\
  api/v1alpha1/**,\
  cmd/**,\
  tests/**,\
  bin/**,\
  engine/store/storetest/**

# Three Kubernetes resource rules are silenced on the Deployment template, and
# only those three: every other rule the analyzer knows still applies to that
# file, and these three still apply everywhere else.
#
# The cpu and memory quantities there come from resource-profiles/, which the
# deployer passes with -f. The analyzer renders the chart against values.yaml
# alone, where those keys are deliberately absent — values.schema.json requires
# them, so an install without a profile fails loudly instead of rendering empty
# resources. Rendered against any profile the container has every request and
# limit set; rendered against values.yaml alone it appears to have none.
#
# Putting defaults in values.yaml would satisfy the schema and silently remove
# that guard, which is the worse trade.
sonar.issue.ignore.multicriteria=cpuRequest,memRequest,memLimit,hostLogs

# S6892 — Specify a CPU request for this container.
sonar.issue.ignore.multicriteria.cpuRequest.ruleKey=kubernetes:S6892
sonar.issue.ignore.multicriteria.cpuRequest.resourceKey=helm-templates/ratelimit/templates/Deployment.yaml

# S6873 — Specify a memory request for this container.
sonar.issue.ignore.multicriteria.memRequest.ruleKey=kubernetes:S6873
sonar.issue.ignore.multicriteria.memRequest.resourceKey=helm-templates/ratelimit/templates/Deployment.yaml

# S6864 — Specify a memory limit for this container.
sonar.issue.ignore.multicriteria.memLimit.ruleKey=kubernetes:S6864
sonar.issue.ignore.multicriteria.memLimit.resourceKey=helm-templates/ratelimit/templates/Deployment.yaml

# S6433 — Sensitive file system paths should not be mounted in containers.
# The e2e log collector exists to read the node's container logs: the
# /var/log/pods and /var/log/containers mounts are not an accident of the
# manifest but the whole of its purpose. They are read-only, and the file is
# deployed only on the throwaway kind node of a CI run.
sonar.issue.ignore.multicriteria.hostLogs.ruleKey=kubernetes:S6433
sonar.issue.ignore.multicriteria.hostLogs.resourceKey=tests/e2e/manifests/fluent-bit.yaml
